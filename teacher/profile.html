<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - MPSU ETEEAP LMS</title>
    <link rel="stylesheet" href="teacher.css">
</head>
<body>
<div class="top-bar">
    <div class="school-info">
        <img src="../images/mpsu-logo.png">
        <div>
            <h2>MPSU ETEEAP LMS</h2>
            <p>Mountain Province State University</p>
        </div>
    </div>
    <a href="profile.html" class="user">
        <div class="user-picture">
            <i class="fa-solid fa-user"></i>
        </div>
        <div>
            <b>Instructor Bev</b>
        </div>
    </a>   
</div>

<div class="main-container">

<!-- sidebar -->
    <div class="sidebar">
        <div class="view-title"><p>View</p><i class="fa-solid fa-table-columns"></i></div>
        <a href="dashboard.html" class="menu"><i class="fa-solid fa-house"></i><p>Dashboard</p></a>
        <a href="modules.html" class="menu"><i class="fa-solid fa-folder-open"></i><p>My Modules</p></a>
        <a href="assessments.html" class="menu"><i class="fa-solid fa-clipboard-list"></i><p>Assessments</p></a>
        <a href="grades.html" class="menu"><i class="fa-solid fa-chart-line"></i><p>Grades</p></a>
        <a href="announcements.html" class="menu"><i class="fa-solid fa-bullhorn"></i><p>Announcements</p></a>
        <a href="profile.html" class="menu active"><i class="fa-solid fa-user"></i><p>Profile</p></a>
        <a href="logout.html" class="menu logout"><i class="fa-solid fa-right-from-bracket"></i><p>Logout</p></a>
    </div>

<div class="main">
<div class="profile-container">
<h1>Teacher Profile</h1>
<br>
<div class="profile-card">
<div class="profile-header">
<img src="../images/profile.png" id="profileImage">
<div>
<h2 id="displayName">Prof. Maria Santos</h2>
<p>Instructor</p>
<p>MPSU ETEEAP LMS</p>
</div>
</div>

<div class="profile-grid">
<div>
<label>Full Name</label>
<input type="text" id="name" value="Prof. Maria Santos" disabled>
</div>

<div>
<label>Email</label>
<input type="email" id="email" value="maria.santos@mpsu.edu.ph" disabled>
</div>

<div>
<label>Department</label>
<input type="text" id="department" value="ETEEAP" disabled>
</div>
<div>

<label>Contact Number</label>
<input type="text" id="contact" value="09123456789" disabled>
</div>

<div>
<label>Employee ID</label>
<input type="text"id="employee"value="EMP-2026-001"disabled>
</div>

<div>
<label>Office</label>
<input type="text"id="office"value="MPSU Main Campus"disabled>
</div>
</div>

<div class="button-group">
<button onclick="editProfile()"><i class="fa-solid fa-pen"></i>Edit Profile</button>
<button onclick="saveProfile()"><i class="fa-solid fa-floppy-disk"></i>Save Changes</button>
<button class="cancel-btn" onclick="cancelEdit()">Cancel</button>
</div>
</div>
</div>
</div>
<script>
</script>
</body>
</html>
