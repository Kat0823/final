<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPSU ETEEAP LMS - Instructor Logout</title>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Link external CSS -->
   <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <link rel="stylesheet" href="../teacher/CSS/logout.css" />
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="header">
    <div class="header-left">
      <div class="logo-box">
        <img src="../images/logo.png" alt="MPSU Logo">
      </div>
      <div class="header-titles">
        <div class="main-title">MPSU ETEEAP LMS</div>
        <div class="sub-title">Mountain Province State University</div>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn" title="Notifications">
        <i class="fa-regular fa-bell"></i>
      </button>

      <div class="user-profile">
        <div class="avatar-ring">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Macross Arsel Avatar" />
        </div>
        <div class="user-info">
          <span class="user-name">Macross Arsel <i class="fa-solid fa-caret-down"></i></span>
          <span class="user-role">Administrator</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div class="app-body">

    <!-- Deep Maroon Sidebar -->
    <aside class="sidebar">
      <div class="view-header">
        <span class="view-label">View</span>
        <button class="view-toggle-btn" title="Toggle Layout">
          <i class="fa-regular fa-rectangle-list"></i>
        </button>
      </div>

      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-users"></i>
          <span>Learners Progress</span>
        </a>

        <a href="class.html" class="nav-item">
          <i class="fa-solid fa-layer-group"></i>
          <span>Classes</span>
        </a>

        <a href="submissions.html" class="nav-item">
          <i class="fa-regular fa-folder"></i>
          <span>Submission</span>
        </a>

        <a href="notification.html" class="nav-item">
          <i class="fa-regular fa-bell"></i>
          <span>Notifications</span>
        </a> 
      </nav>

        <!-- Highlighted Logout Item Pushed To Bottom -->
        <a href="logout.html" class="nav-item active-logout logout-bottom" id="logoutNavItem">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Content Workspace -->
    <main class="main-content">
      <!-- Confirmation Modal Box -->
      <div class="confirmation-box" id="confirmModal">
        <div class="box-header">Confirmation Box</div>
        <div class="box-body">
          Are you sure you want to logout?
        </div>
        <div class="box-actions">
          <button class="btn btn-no" id="btnNo">No</button>
          <button class="btn btn-yes" id="btnYes">Yes</button>
        </div>
      </div>
    </main>

  </div>


    <script>
        const viewToggle =
            document.getElementById("viewToggle");
        const sidebar =
            document.querySelector(".sidebar");
        const mainContent =
            document.querySelector(".main-content");
        viewToggle.addEventListener("click", function () {
            sidebar.classList.toggle("collapsed");
            mainContent.classList.toggle("expanded");
        });
    </script>

</body>
</html>
