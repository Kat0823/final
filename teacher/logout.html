<body>

        <div class="main-title">MPSU ETEEAP LMS</div>
        <div class="sub-title">Mountain Province State University</div>
      </div>
    </div>

       <div class="header-right">
      <div class="user-profile" id="userProfileBtn" style="cursor: pointer;">
        <div class="avatar-ring">
          <img id="headerAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Macross Arsel Avatar" />
        </div>
        <div class="user-info">
          <span class="user-name">Macross Arsel <i class="fa-solid fa-caret-down"></i></span>
          <span class="user-role">Instructor</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body Layout -->
  <div class="app-body">

    <!-- Deep Maroon Sidebar -->
    <aside class="sidebar">
      <div class="view-header">

        <button class="view-toggle-btn" title="Toggle Layout">
          <i class="fa-regular fa-rectangle-list"></i>
        </button>
      </div>

      <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-users"></i>
          <span>Learners Progress</span>
        </a>

        <a href="class.html" class="nav-item">
          <i class="fa-solid fa-layer-group"></i>
          <span>Classes</span>
        </a>

        <a href="submissions.html" class="nav-item">

          <span>Submission</span>
        </a>

        </a>

  <!-- INSTRUCTOR PROFILE SETTINGS MODAL -->
  <div class="profile-modal-overlay" id="profileModalOverlay">
    <div class="profile-modal-card">
      
      <!-- Modal Header -->
      <div class="profile-modal-header">
        <div>
          <h3 class="profile-modal-title">Instructor Profile Settings</h3>
        </div>
        <button class="profile-modal-close" id="closeProfileModal" aria-label="Close">&times;</button>
      </div>

      <!-- Modal Body Form -->
      <form id="profileSettingsForm">
        <div class="profile-modal-body">
          
          <!-- Photo Upload Section -->
          <div class="avatar-upload-section">
            <div class="avatar-upload-preview">
              <img id="avatarPreview" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" alt="Instructor Profile Picture">
              <label for="avatarInput" class="avatar-edit-badge" title="Change Photo">
                <i class="fa-solid fa-camera"></i>
              </label>
              <input type="file" id="avatarInput" accept="image/*" class="avatar-file-input">
            </div>
            <div class="avatar-upload-text">
              <h4>Profile Photo</h4>
            </div>
          </div>

          <!-- Read-Only Grid: Instructor ID & Full Name -->
          <div class="form-grid-2">
            <div class="profile-form-group">
              <label for="instructorId">Instructor ID</label>
              <input type="text" id="instructorId" value="INST-2024-008" disabled class="input-disabled">
            </div>
            <div class="profile-form-group">
              <label for="instructorName">Full Name</label>
              <input type="text" id="instructorName" value="Macross Arsel" disabled class="input-disabled">
            </div>
          </div>

          <!-- Editable Fields: Email & Phone -->
          <div class="profile-form-group">
            <label for="instructorEmail">Email Address</label>
            <input type="email" id="instructorEmail" value="macross.arsel@mpsu.edu.ph" required>
          </div>

          <div class="profile-form-group">
            <label for="instructorPhone">Mobile Number</label>
            <input type="tel" id="instructorPhone" value="+63 917 123 4567" placeholder="+63 9XX XXX XXXX" required>
          </div>

          <!-- Permanently Displayed Change Password Section -->
          <div class="password-section">
            <div class="section-title">
              <h4><i class="fa-solid fa-lock"></i> Change Password</h4>
            </div>
            <div class="password-fields-wrapper">
              <div class="profile-form-group">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password">
              </div>
              <div class="profile-form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password (min. 6 characters)">
              </div>
              <div class="profile-form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
              </div>
            </div>
          </div>

        </div>

        <!-- Modal Footer Actions -->
        <div class="profile-modal-footer">
          <button type="button" class="btn-cancel" id="cancelProfileModal">Cancel</button>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>

    </div>
  </div>
  <!-- CONTENT -->

        <main class="content">


            <div class="title-row">

                <h1>
                    Logout
                </h1>

            </div>


            <hr>


            <!-- LOGOUT CARD -->

            <div class="logout-container">

                <div class="logout-box">

                    <div class="logout-icon">

                        <i class="fa-solid fa-right-from-bracket"></i>

                    </div>


                    <h2>
                        Are you sure?
                    </h2>


                    <p>
                        Do you really want to logout from
                        your student account?
                    </p>


                    <div class="logout-buttons">

                        <button
                            type="button"
                            class="cancel-btn"
                            onclick="goBack()">

                            Cancel

                        </button>


                        <button
                            type="button"
                            class="confirm-logout-btn"
                            onclick="logoutUser()">

                            Yes, Logout

                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script>

        function goBack() {

            window.location.href = "classes.html";

        }


        function logoutUser() {

            sessionStorage.clear();

            localStorage.removeItem("isLoggedIn");

            window.location.href = "../index.html";

        }

    </script>
   <!-- -->
  <script>
    // Sidebar Toggle
   const viewToggle =
            document.getElementById("viewToggle");
        const sidebar =
            document.querySelector(".sidebar");
        const mainContent =
            document.querySelector(".main-content");
        viewToggle.addEventListener("click", function () {
            sidebar.classList.toggle("collapsed");
            mainContent.classList.toggle("expanded");
        });
    

    // Modal Elements
    const userProfileBtn = document.getElementById("userProfileBtn");
    const profileModalOverlay = document.getElementById("profileModalOverlay");
    const closeProfileModal = document.getElementById("closeProfileModal");
    const cancelProfileModal = document.getElementById("cancelProfileModal");
    const avatarInput = document.getElementById("avatarInput");
    const avatarPreview = document.getElementById("avatarPreview");
    const headerAvatar = document.getElementById("headerAvatar");
    const profileForm = document.getElementById("profileSettingsForm");

    // Password Accordion Elements
    const passwordSection = document.getElementById("passwordSection");
    const passwordToggleBtn = document.getElementById("passwordToggleBtn");
    const currentPasswordInput = document.getElementById("currentPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    // Toast Notification Helper
    function showToast(message, type = "success") {
      const toastContainer = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      
      const iconClass = type === "success" ? "fa-circle-check" : "fa-circle-exclamation";
      toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;
      
      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.classList.add("show");
      }, 10);

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Toggle Change Password Accordion
    if (passwordToggleBtn) {
      passwordToggleBtn.addEventListener("click", () => {
        passwordSection.classList.toggle("open");
      });
    }

    // Open Profile Modal
    if (userProfileBtn) {
      userProfileBtn.addEventListener("click", () => {
        profileModalOverlay.classList.add("active");
      });
    }

    // Reset Form Fields
    function resetPasswordFields() {
      passwordSection.classList.remove("open");
      currentPasswordInput.value = "";
      newPasswordInput.value = "";
      confirmPasswordInput.value = "";
    }

    // Close Modal Handler
    const closeModal = () => {
      profileModalOverlay.classList.remove("active");
      resetPasswordFields();
    };

    if (closeProfileModal) closeProfileModal.addEventListener("click", closeModal);
    if (cancelProfileModal) cancelProfileModal.addEventListener("click", closeModal);

    // Close Modal on backdrop click
    profileModalOverlay.addEventListener("click", (e) => {
      if (e.target === profileModalOverlay) closeModal();
    });

    // Avatar Image Preview
    avatarInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 2 * 1024 * 1024) {
          showToast("Image size exceeds 2MB limit", "error");
          return;
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          avatarPreview.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Form Submission & Interactive Password Validation
    profileForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const email = document.getElementById("instructorEmail").value.trim();
      const phone = document.getElementById("instructorPhone").value.trim();

      if (!email || !phone) {
        showToast("Please fill in all contact information", "error");
        return;
      }

      const currentPass = currentPasswordInput.value.trim();
      const newPass = newPasswordInput.value.trim();
      const confirmPass = confirmPasswordInput.value.trim();

      // Password Validation Logic
      const isPasswordTouched = currentPass || newPass || confirmPass;

      if (isPasswordTouched) {
        // Automatically open section if error occurs
        if (!passwordSection.classList.contains("open")) {
          passwordSection.classList.add("open");
        }

        if (!currentPass) {
          showToast("Please enter your current password", "error");
          currentPasswordInput.focus();
          return;
        }

        if (!newPass) {
          showToast("Please enter a new password", "error");
          newPasswordInput.focus();
          return;
        }

        if (newPass.length < 6) {
          showToast("New password must be at least 6 characters long", "error");
          newPasswordInput.focus();
          return;
        }

        if (newPass !== confirmPass) {
          showToast("New passwords do not match", "error");
          confirmPasswordInput.focus();
          return;
        }
      }

      // Sync avatar picture to header
      headerAvatar.src = avatarPreview.src;

      showToast("Profile settings saved successfully!", "success");
      closeModal();
    });
  </script>

</body>
</html>
