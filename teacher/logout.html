<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard - MPSU ETEEAP LMS</title>
    <link rel="stylesheet" href="teacher.css">
</head>
<body>
<div class="top-bar">
    <div class="school-info">
        <img src="../images/logo.png">
        <div>
            <h2>MPSU ETEEAP LMS</h2>
            <p>Mountain Province State University</p>
        </div>
    </div>
      <a href="profile.html" class="user">
        <div class="user-picture">
            <i class="fa-solid fa-user"></i>
        </div>
        <div>
            <b>Instructor Bev</b>
        </div>
    </a>   
</div>

<div class="main-container">

<!-- sidebar -->
    <div class="sidebar">
        <div class="view-title"><p>View</p><i class="fa-solid fa-table-columns"></i></div>
        <a href="dashboard.html" class="menu"><i class="fa-solid fa-house"></i><p>Dashboard</p></a>
        <a href="modules.html" class="menu"><i class="fa-solid fa-folder-open"></i><p>My Modules</p></a>
        <a href="assessments.html" class="menu"><i class="fa-solid fa-clipboard-list"></i><p>Assessments</p></a>
        <a href="grades.html" class="menu"><i class="fa-solid fa-chart-line"></i><p>Grades</p></a>
        <a href="announcements.html" class="menu"><i class="fa-solid fa-bullhorn"></i><p>Announcements</p></a>
        <a href="profile.html" class="menu"><i class="fa-solid fa-user"></i><p>Profile</p></a>
        <a href="logout.html" class="menu logout active"><i class="fa-solid fa-right-from-bracket"></i><p>Logout</p></a>
    </div>


    <main class="content logout-content">
        <div class="logout-box">
            <div class="logout-icon">
                <i class="fa-solid fa-right-from-bracket"></i>
            </div>
            <h1>Are you sure?</h1>
            <p>Do you really want to logout from your Instructor account?</p>
            <div class="logout-buttons">
                <button class="cancel-btn" onclick="window.location.href='dashboard.html'">Cancel</button>

                <button class="confirm-logout-btn" onclick="confirmLogout()">Yes, Logout</button>
            </div>
        </div>
    </main>
</div>
<script src="teacher.js"></script>

</body>
</html>
