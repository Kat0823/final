<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPSU ETEEAP LMS - Notifications</title>
  <!-- External CSS -->
  <link rel="stylesheet" href="../teacher/CSS/notification.css">
  <!-- Font Awesome Icons -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- External CSS -->
</head>
<body>

  <!-- Top Header Navigation -->
 <header class="header">
    <div class="header-left">
      <div class="logo-box">
        <img src="../images/logo.png" alt="MSPU logo">
      </div>

      <div class="header-title">
        <div class="system-title">MPSU ETEEAP LMS</div>
        <div class="university-name">Mountain Province State University</div>
      </div>
    </div>
    
    <div class="header-right">
      <button class="icon-btn bell-btn">
        <i class="fa-regular fa-bell"></i>
      </button>
      <div class="user-info">
        <img src="https://via.placeholder.com/40" alt="Profile Avatar" class="avatar-header">
        <div class="user-text">
          <span class="user-name">Macross Arsel <i class="fa-solid fa-caret-down"></i></span>
          <span class="user-role">Instructor</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="app-body">

    <!-- Deep Maroon Sidebar -->
    <aside class="sidebar">
      <div class="view-header">
        <span class="view-label">View</span>
        <button class="view-toggle-btn" title="Toggle Layout">
          <i class="fa-regular fa-rectangle-list"></i>
        </button>
      </div>

        <!-- Active Menu Item -->
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-users"></i>
          <span>Learners Progress</span>
        </a>

        <a href="class.html" class="nav-item">
          <i class="fa-solid fa-layer-group"></i>
          <span>Classes</span>
        </a>

        <a href="submissions.html" class="nav-item">
          <i class="fa-regular fa-folder"></i>
          <span>Submission</span>
        </a>

        <a href="notification.html" class="nav-item active">
          <i class="fa-regular fa-bell"></i>
          <span>Notification</span>
        </a>

        <!-- Logout Item Pushed to Bottom -->
        <a href="logout.html" class="nav-item logout-bottom">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Content Workspace Area -->
    <main class="content-container">
      <div class="notifications-card-box">
        <h1 class="page-title">Notifications</h1>

        <div class="notifications-list">
          
          <!-- Notification Item 1 -->
          <div class="notification-card">
            <div class="notification-avatar default-avatar-placeholder">
              <!-- No image avatar version -->
            </div>
            <div class="notification-details">
              <h3 class="student-name">Kim Reyes</h3>
              <p class="notification-action">Graded: Module 1</p>
              <p class="course-name">Intro to Criminal Law</p>
            </div>
          </div>

          <!-- Notification Item 2 -->
          <div class="notification-card">
            <div class="notification-avatar">
              <i class="fa-regular fa-user"></i>
            </div>
            <div class="notification-details">
              <h3 class="student-name">Patricia Flores</h3>
              <p class="notification-action">Graded: Module 5</p>
              <p class="course-name">Criminal Law Fundamental</p>
            </div>
          </div>

        </div>
      </div>
    </main>

  </div>

</body>
</html>
