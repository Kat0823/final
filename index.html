<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MPSU ETEEAP LMS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* MAIN CONTAINER */
        .login-container {
            width: 100%;
            max-width: 1050px;
            min-height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            overflow: hidden;
        }

        /* LEFT SECTION */
        .left-section {
            width: 50%;
            background: #086b3c;
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 25px;
        }

        .left-section h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .left-section h2 {
            font-size: 18px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .left-section p {
            max-width: 400px;
            font-size: 16px;
            line-height: 1.6;
        }

        .tagline {
            margin-top: 30px;
            font-size: 18px !important;
            font-weight: bold;
            color: #ffd34e;
        }

        /* RIGHT SECTION */
        .right-section {
            width: 50%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 30px;
            color: #086b3c;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-container {
            position: relative;
            width: 100%;
        }

        .input-container i.input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .input-container input {
            width: 100%;
            height: 48px;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 0 45px;
            font-size: 15px;
            outline: none;
        }

        .input-container input:focus {
            border-color: #086b3c;
            box-shadow: 0 0 0 2px rgba(8, 107, 60, 0.10);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
            font-size: 16px;
        }

        .password-toggle:hover {
            color: #086b3c;
        }

        /* FORGOT PASSWORD */
        .forgot-password {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #086b3c;
            font-size: 14px;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* LOGIN BUTTON */
        .login-button {
            width: 100%;
            min-height: 48px;
            border: none;
            border-radius: 7px;
            background: #086b3c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #064f2d;
        }

        .login-button:disabled {
            background: #8a9f94;
            cursor: not-allowed;
        }

        /* MESSAGE */
        .message {
            display: none;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error,
        .message.success {
            display: block;
        }

        .message.error {
            background: #ffe8e8;
            color: #a00000;
            border: 1px solid #f0b5b5;
        }

        .message.success {
            background: #e8f6ee;
            color: #086b3c;
            border: 1px solid #a9d8bc;
        }

        /* FOOTER */
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
            line-height: 1.8;
        }

        .login-footer a {
            color: #086b3c;
            text-decoration: none;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* MOBILE */
        @media (max-width: 800px) {
            .login-container {
                flex-direction: column;
                max-width: 550px;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .left-section {
                padding: 35px 25px;
                min-height: 330px;
            }

            .right-section {
                padding: 35px 25px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .left-section h1 {
                font-size: 25px;
            }

            .left-section h2 {
                font-size: 16px;
            }

            .tagline {
                margin-top: 20px;
            }
        }

        @media (max-width: 450px) {
            body {
                padding: 10px;
            }

            .left-section {
                padding: 30px 20px;
            }

            .right-section {
                padding: 30px 20px;
            }

            .left-section h1 {
                font-size: 22px;
            }

            .left-section p {
                font-size: 14px;
            }

            .login-title {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- LEFT SECTION -->
        <section class="left-section">

            <img src="images/logo.png"
                alt="MPSU Logo"
                class="logo">

            <h1>MPSU ETEEAP LMS</h1>

            <h2>Mountain Province State University</h2>

            <p>
                Expanded Tertiary Education Equivalency
                and Accreditation Program
            </p>

            <p class="tagline">
                Empowering Learners.
                Transforming Futures.
            </p>

        </section>

        <!-- RIGHT SECTION -->
        <section class="right-section">

            <h1 class="login-title">Welcome Back</h1>

            <p class="login-subtitle">
                Sign in to access your ETEEAP learning account.
            </p>

            <!-- LOGIN MESSAGE -->
            <div id="loginMessage"
                class="message"
                role="alert"
                aria-live="polite">
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- SCHOOL ID -->
                <div class="form-group">

                    <label for="studentId">ID</label>

                    <div class="input-container">

                        <i class="fa-regular fa-id-card input-icon"></i>

                        <input
                            type="text"
                            id="studentId"
                            name="school_id"
                            placeholder="Enter your ID"
                            required
                            autocomplete="username">

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-container">

                        <i class="fa-solid fa-lock input-icon"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password">

                        <i
                            id="passwordIcon"
                            class="fa-regular fa-eye password-toggle"
                            title="Show password"
                            role="button"
                            tabindex="0"
                            aria-label="Show password">
                        </i>

                    </div>

                </div>

                <!-- FORGOT PASSWORD -->
                <div class="forgot-password">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-button"
                    id="loginButton">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login

                </button>

            </form>

            <!-- FOOTER -->
            <div class="login-footer">

                <p>MPSU ETEEAP LMS</p>

                <p>
                    <a href="terms.html">Terms of Service</a>
                </p>

            </div>

        </section>

    </div>

    <script>
        /*
         * Laravel API address.
         * Make sure your backend is running on port 8000.
         */
        const API_BASE_URL = "http://localhost:8000";

        // Form elements
        const loginForm = document.getElementById("loginForm");
        const studentIdInput = document.getElementById("studentId");
        const passwordInput = document.getElementById("password");
        const passwordIcon = document.getElementById("passwordIcon");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");

        // Show or hide password
        function togglePassword() {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";

            passwordIcon.classList.toggle("fa-eye", !isHidden);
            passwordIcon.classList.toggle("fa-eye-slash", isHidden);

            passwordIcon.title = isHidden
                ? "Hide password"
                : "Show password";

            passwordIcon.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        }

        passwordIcon.addEventListener("click", togglePassword);

        passwordIcon.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                togglePassword();
            }
        });

        // Display a message
        function showMessage(message, type) {
            loginMessage.textContent = message;
            loginMessage.className = "message " + type;
        }

        // Redirect according to account role
        function redirectByRole(role) {
            const destinations = {
                learner: "student/classes.html",
                instructor: "teacher/dashboard.html",
                admin: "Admin/dashboard.html",
                administrator: "Admin/dashboard.html",
                director: "director/dashboard.html"
            };

            return destinations[role] || null;
        }

        // Login form
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Read the ID and password from the form
            const studentId = studentIdInput.value.trim();
            const password = passwordInput.value;

            if (!studentId || !password) {
                showMessage(
                    "Please enter your ID and password.",
                    "error"
                );
                return;
            }

            loginButton.disabled = true;

            loginButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

            loginMessage.className = "message";
            loginMessage.textContent = "";

            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/login`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            school_id: studentId,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Invalid ID or password."
                    );
                }

                if (!data.token || !data.user || !data.user.role) {
                    throw new Error(
                        "The server returned incomplete login information."
                    );
                }

                const role = data.user.role;
                const destination = redirectByRole(role);

                if (!destination) {
                    throw new Error(
                        "Your account has an unrecognized role."
                    );
                }

                // Store the token and user for this browser session.
                // Never store the user's password.
                sessionStorage.setItem("authToken", data.token);

                sessionStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                // First-time password setup
                if (data.first_login === true) {
                    sessionStorage.setItem("firstLogin", "true");

                    const setupPages = {
                        learner: "student/setup.html",
                        instructor: "teacher/setup.html",
                        admin: "Admin/setup.html",
                        administrator: "Admin/setup.html",
                        director: "director/setup.html"
                    };

                    const setupDestination = setupPages[role];

                    if (!setupDestination) {
                        sessionStorage.removeItem("authToken");
                        sessionStorage.removeItem("user");
                        sessionStorage.removeItem("firstLogin");

                        throw new Error(
                            "No password setup page is configured for this role."
                        );
                    }

                    window.location.href = setupDestination;
                    return;
                }

                sessionStorage.removeItem("firstLogin");

                // Existing accounts go to their own page.
                window.location.href = destination;

            } catch (error) {
                console.error("Login error:", error);

                if (error instanceof TypeError) {
                    showMessage(
                        "Unable to connect to the server. Check that your Laravel backend is running and the API address is correct.",
                        "error"
                    );
                } else {
                    showMessage(
                        error.message || "Unable to log in. Please try again.",
                        "error"
                    );
                }

            } finally {
                loginButton.disabled = false;

                loginButton.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket"></i> Login';
            }
        });
    </script>

</body>
</html>
