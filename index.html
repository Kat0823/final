<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - MPSU ETEEAP LMS</title>


    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f5f5f5;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .login-container {

            width: 100%;

            max-width: 1050px;

            min-height: 600px;

            background: white;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);

            display: flex;

            overflow: hidden;
        }


        /* =====================================================
           LEFT SECTION
        ===================================================== */

        .left-section {

            width: 50%;

            background: #086b3c;

            color: white;

            padding: 50px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }


        .logo {

            width: 130px;

            height: 130px;

            object-fit: contain;

            margin-bottom: 25px;
        }


        .left-section h1 {

            font-size: 30px;

            margin-bottom: 10px;
        }


        .left-section h2 {

            font-size: 18px;

            font-weight: normal;

            margin-bottom: 25px;
        }


        .left-section p {

            max-width: 400px;

            font-size: 16px;

            line-height: 1.6;
        }


        .tagline {

            margin-top: 30px;

            font-size: 18px !important;

            font-weight: bold;

            color: #ffd34e;
        }


        /* =====================================================
           RIGHT SECTION
        ===================================================== */

        .right-section {

            width: 50%;

            padding: 50px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .login-title {

            font-size: 30px;

            color: #086b3c;

            margin-bottom: 8px;
        }


        .login-subtitle {

            color: #666;

            font-size: 15px;

            line-height: 1.5;

            margin-bottom: 30px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            color: #333;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .input-container {

            position: relative;

            width: 100%;
        }


        .input-container i.input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #777;
        }


        .input-container input {

            width: 100%;

            height: 48px;

            border: 1px solid #ccc;

            border-radius: 7px;

            padding: 0 45px;

            font-size: 15px;

            outline: none;
        }


        .input-container input:focus {

            border-color: #086b3c;

            box-shadow:
                0 0 0 2px rgba(8, 107, 60, 0.10);
        }


        /* =====================================================
           PASSWORD TOGGLE
        ===================================================== */

        .password-toggle {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            color: #777;

            cursor: pointer;

            font-size: 16px;
        }


        .password-toggle:hover {

            color: #086b3c;
        }


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        .forgot-password {

            display: flex;

            justify-content: flex-end;

            margin-top: -8px;

            margin-bottom: 20px;
        }


        .forgot-password a {

            color: #086b3c;

            font-size: 14px;

            text-decoration: none;
        }


        .forgot-password a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            min-height: 48px;

            border: none;

            border-radius: 7px;

            background: #086b3c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }


        .login-button:hover {

            background: #064f2d;
        }


        .login-button:disabled {

            background: #8a9f94;

            cursor: not-allowed;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: none;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 7px;

            font-size: 14px;

            line-height: 1.5;

            overflow-wrap: anywhere;
        }


        .message.error,
        .message.success {

            display: block;
        }


        .message.error {

            background: #ffe8e8;

            color: #a00000;

            border: 1px solid #f0b5b5;
        }


        .message.success {

            background: #e8f6ee;

            color: #086b3c;

            border: 1px solid #a9d8bc;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {

            text-align: center;

            margin-top: 25px;

            color: #777;

            font-size: 13px;

            line-height: 1.8;
        }


        .login-footer a {

            color: #086b3c;

            text-decoration: none;
        }


        .login-footer a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .login-container {

                flex-direction: column;

                max-width: 550px;
            }


            .left-section,
            .right-section {

                width: 100%;
            }


            .left-section {

                padding: 35px 25px;

                min-height: 330px;
            }


            .right-section {

                padding: 35px 25px;
            }


            .logo {

                width: 100px;

                height: 100px;
            }


            .left-section h1 {

                font-size: 25px;
            }


            .left-section h2 {

                font-size: 16px;
            }


            .tagline {

                margin-top: 20px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 450px) {

            body {

                padding: 10px;
            }


            .left-section {

                padding: 30px 20px;
            }


            .right-section {

                padding: 30px 20px;
            }


            .left-section h1 {

                font-size: 22px;
            }


            .left-section p {

                font-size: 14px;
            }


            .login-title {

                font-size: 25px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN LOGIN CONTAINER
    ====================================================== -->

    <div class="login-container">


        <!-- =================================================
             LEFT SECTION
        ================================================== -->

        <section class="left-section">


            <!-- MPSU LOGO -->

            <img
                src="images/logo.png"
                alt="MPSU Logo"
                class="logo"
            >


            <!-- SYSTEM NAME -->

            <h1>
                MPSU ETEEAP LMS
            </h1>


            <!-- UNIVERSITY -->

            <h2>
                Mountain Province State University
            </h2>


            <!-- PROGRAM -->

            <p>
                Expanded Tertiary Education Equivalency
                and Accreditation Program
            </p>


            <!-- TAGLINE -->

            <p class="tagline">
                Empowering Learners.
                Transforming Futures.
            </p>


        </section>


        <!-- =================================================
             RIGHT SECTION
        ================================================== -->

        <section class="right-section">


            <!-- LOGIN TITLE -->

            <h1 class="login-title">
                Welcome Back
            </h1>


            <!-- LOGIN SUBTITLE -->

            <p class="login-subtitle">
                Sign in to access your ETEEAP learning account.
            </p>


            <!-- =================================================
                 LOGIN MESSAGE

                 JavaScript can use this area to display
                 login errors or other messages.
            ================================================== -->

            <div
                id="loginMessage"
                class="message"
                role="alert"
                aria-live="polite">
            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form id="loginForm">


                <!-- =================================================
                     ID
                ================================================== -->

                <div class="form-group">

                    <label for="studentId">
                        ID
                    </label>


                    <div class="input-container">

                        <i
                            class="fa-regular fa-id-card input-icon">
                        </i>


                        <input
                            type="text"
                            id="studentId"
                            name="school_id"
                            placeholder="Enter your ID"
                            required
                            autocomplete="username"
                        >

                    </div>

                </div>


                <!-- =================================================
                     PASSWORD
                ================================================== -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-container">


                        <!-- Lock icon -->

                        <i
                            class="fa-solid fa-lock input-icon">
                        </i>


                        <!-- Password input -->

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >


                        <!-- Show / Hide Password -->

                        <i
                            id="passwordIcon"
                            class="fa-regular fa-eye password-toggle"
                            title="Show password"
                            role="button"
                            tabindex="0"
                            aria-label="Show password">
                        </i>


                    </div>

                </div>


                <!-- =================================================
                     FORGOT PASSWORD
                ================================================== -->

                <div class="forgot-password">

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login

                </button>


            </form>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <div class="login-footer">

                <p>
                    MPSU ETEEAP LMS
                </p>


                <p>

                    <a href="terms.html">
                        Terms of Service
                    </a>

                </p>

            </div>


        </section>


    </div>


    <!-- =====================================================
         LOGIN JAVASCRIPT

         IMPORTANT:
         The authentication code is now inside login.js.

         Do NOT add another inline login <script> here.
    ====================================================== -->

    <script src="login.js"></script>


</body>

</html>
