<form id="loginForm">

    <div class="input-group">

        <label for="studentId">
            Student ID
        </label>

        <input
            type="text"
            id="studentId"
            name="studentId"
            placeholder="Enter your Student ID"
            required
        >

    </div>


    <div class="input-group">

        <label for="password">
            Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="button"
                class="password-toggle"
                onclick="toggleLoginPassword()"
            >

                <i
                    class="fa-solid fa-eye"
                    id="passwordIcon"
                ></i>

            </button>

        </div>

    </div>


    <div class="forgot-password">

        <a href="forgot-password.html">
            Forgot Password?
        </a>

    </div>


    <button
        type="submit"
        class="login-btn"
    >
        Login
    </button>

</form>


<script src="login.js"></script>
