<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 200" preserveAspectRatio="xMidYMax slice">
  <!-- Decorative sidebar foot: soft, tone-on-tone maroon mountain ranges
       with a fine diamond texture. Drawn shapes, no photos. -->
  <defs>
    <pattern id="texture" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 H8 M0 0 V8" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="far" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a5333b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8a1f26" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="near" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#94252c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6e1218" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Far range -->
  <path fill="url(#far)"
        d="M0 112 L34 84 L58 96 L96 52 L128 82 L150 70 L190 104 L222 80 L245 92 L245 200 L0 200 Z"/>
  <!-- Ridge highlight -->
  <path fill="none" stroke="#c4535a" stroke-opacity="0.35" stroke-width="1"
        d="M0 112 L34 84 L58 96 L96 52 L128 82 L150 70 L190 104 L222 80 L245 92"/>

  <!-- Near range -->
  <path fill="url(#near)"
        d="M0 150 L44 120 L76 136 L118 104 L160 138 L196 116 L245 142 L245 200 L0 200 Z"/>
  <path fill="none" stroke="#b23b42" stroke-opacity="0.3" stroke-width="1"
        d="M0 150 L44 120 L76 136 L118 104 L160 138 L196 116 L245 142"/>

  <!-- Fine texture over the mountains -->
  <path fill="url(#texture)"
        d="M0 112 L34 84 L58 96 L96 52 L128 82 L150 70 L190 104 L222 80 L245 92 L245 200 L0 200 Z"/>

</svg>
