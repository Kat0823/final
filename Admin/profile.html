<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Profile</title>

    <link rel="stylesheet" href="admin.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="top-bar">

    <div class="school-info">

        <img src="../images/mpsu-logo.png">

        <div>
            <h2>MPSU ETEEAP LMS</h2>
            <p>Mountain Province State University</p>
        </div>

    </div>

</header>


<div class="main-container">

    <aside class="sidebar">

        <div class="view-title">
            <span>Admin Menu</span>
        </div>

        <a href="dashboard.html" class="menu">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <a href="users.html" class="menu">
            <i class="fa-solid fa-users"></i>
            <span>Users</span>
        </a>

        <a href="students.html" class="menu">
            <i class="fa-solid fa-user-graduate"></i>
            <span>Students</span>
        </a>

        <a href="instructors.html" class="menu">
            <i class="fa-solid fa-chalkboard-user"></i>
            <span>Instructors</span>
        </a>

        <a href="modules.html" class="menu">
            <i class="fa-solid fa-book"></i>
            <span>Modules</span>
        </a>

        <a href="assessments.html" class="menu">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Assessments</span>
        </a>

        <a href="announcements.html" class="menu">
            <i class="fa-solid fa-bullhorn"></i>
            <span>Announcements</span>
        </a>

        <a href="reports.html" class="menu">
            <i class="fa-solid fa-chart-column"></i>
            <span>Reports</span>
        </a>

        <a href="profile.html" class="menu active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>

        <a href="settings.html" class="menu">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </a>

        <a href="logout.html" class="menu logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>

    </aside>


    <main class="content">

        <h1>Admin Profile</h1>


        <div class="profile-card">

            <div class="large-profile-icon">

                <i class="fa-solid fa-user"></i>

            </div>


            <h2>Admin User</h2>

            <p>Administrator</p>


            <div class="profile-information">

                <div>

                    <strong>Name</strong>

                    <p>Admin User</p>

                </div>


                <div>

                    <strong>Email</strong>

                    <p>admin@mpsu.edu.ph</p>

                </div>


                <div>

                    <strong>Role</strong>

                    <p>Administrator</p>

                </div>

            </div>


            <a
                href="settings.html"
                class="edit-profile-button">

                Edit Account Settings

            </a>

        </div>

    </main>

</div>


<script src="admin.js"></script>

</body>

</html>
