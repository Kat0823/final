<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - MPSU ETEEAP LMS</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f4f6f5;

            padding: 20px;

        }


        .forgot-container {

            width: 100%;

            max-width: 450px;

            background: white;

            border-radius: 12px;

            padding: 35px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

        }


        .logo {

            text-align: center;

            margin-bottom: 15px;

        }


        .logo img {

            width: 85px;

            height: 85px;

            object-fit: contain;

        }


        h1 {

            text-align: center;

            color: #086b3c;

            font-size: 25px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 28px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 8px;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;

            outline: none;

        }


        input:focus {

            border-color: #086b3c;

        }


        .reset-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #086b3c;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .reset-btn:hover {

            background: #07582f;

        }


        .back-login {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #086b3c;

            text-decoration: none;

            font-size: 14px;

        }


        .back-login:hover {

            text-decoration: underline;

        }


        .message {

            display: none;

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 7px;

            font-size: 14px;

            text-align: center;

        }


        .success {

            background: #e8f5ed;

            color: #086b3c;

        }


        .error {

            background: #fdecec;

            color: #a33;

        }


        @media (max-width: 500px) {

            .forgot-container {

                padding: 25px 20px;

            }


            h1 {

                font-size: 22px;

            }

        }

    </style>

</head>


<body>


    <div class="forgot-container">


        <div class="logo">

            <img
                src="images/logo.png"
                alt="MPSU Logo"
            >

        </div>


        <h1>
            Forgot Password?
        </h1>


        <p class="subtitle">

            Enter your Student ID and registered email
            address to verify your account.

        </p>


        <div
            class="message"
            id="message"
        ></div>


        <form id="forgotPasswordForm">


            <div class="form-group">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    placeholder="Enter your Student ID"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Registered Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-btn"
            >

                <i class="fa-solid fa-key"></i>

                Verify Account

            </button>


        </form>


        <a
            href="index.html"
            class="back-login"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>


    </div>


    <script>

        const forgotForm =
            document.getElementById(
                "forgotPasswordForm"
            );

        const message =
            document.getElementById("message");


        forgotForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const studentId =
                    document
                        .getElementById("studentId")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                /*
                 * FRONTEND DEMO ACCOUNT
                 *
                 * Laravel + MySQL will replace this.
                 */

                const demoStudent = {

                    studentId: "26-00123",

                    email: "arsel@gmail.com"

                };


                /*
                 * Basic validation
                 */

                if (
                    studentId === "" ||
                    email === ""
                ) {

                    showMessage(
                        "Please enter your Student ID and email.",
                        "error"
                    );

                    return;

                }


                /*
                 * Verify account
                 */

                if (
                    studentId !==
                    demoStudent.studentId ||
                    email !==
                    demoStudent.email
                ) {

                    showMessage(
                        "Student ID and email do not match our records.",
                        "error"
                    );

                    return;

                }


                /*
                 * FRONTEND DEMO
                 *
                 * In Laravel, this is where the server
                 * would create a secure password reset token.
                 */

                sessionStorage.setItem(
                    "passwordResetVerified",
                    "true"
                );

                sessionStorage.setItem(
                    "resetStudentId",
                    studentId
                );


                showMessage(
                    "Account verified. You may now create a new password.",
                    "success"
                );


                /*
                 * Go to reset password page
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "reset-password.html";

                    },
                    1000
                );

            }
        );


        function showMessage(
            text,
            type
        ) {

            message.textContent = text;

            message.className =
                "message " + type;

            message.style.display =
                "block";

        }

    </script>

</body>

</html>
