<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="forgot-page">

        <div class="forgot-card">

            <!-- BACK BUTTON -->
            <a href="index.html" class="back-button">

                <i class="fa-solid fa-arrow-left"></i>
                Back

            </a>


            <!-- TITLE -->
            <h1>Forgot Password</h1>

            <p>
                Enter your registered email address to
                receive a password reset request.
            </p>


            <!-- FORM -->
            <form id="forgotPasswordForm">

                <!-- EMAIL -->
                <label for="email">
                    Email Address
                </label>

                <div class="email-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter Email Address"
                        required>

                </div>


                <!-- NOTE -->
                <div class="forgot-note">

                    <p>
                        <strong>Note:</strong>
                        Password reset only works if you have
                        updated your email address in your profile.
                    </p>

                    <p>
                        If you haven't set up your email,
                        please contact your administrator.
                    </p>

                </div>


                <!-- BUTTONS -->
                <div class="forgot-buttons">

                    <a href="index.html" class="cancel-button">
                        Cancel
                    </a>

                    <button type="submit">
                        Reset Password
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script>

        document.getElementById("forgotPasswordForm")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                const email = document
                    .getElementById("email")
                    .value
                    .trim();

                if (email === "") {

                    alert("Please enter your email address.");
                    return;

                }

                alert(
                    "Your password reset request has been submitted for: " +
                    email
                );

                document.getElementById("email").value = "";

            });

    </script>

</body>

</html>
