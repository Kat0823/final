# Serves the static portals (index.html, student/, teacher/, academic-admin/, ...).
# The whole project folder is mounted here, so everything that is not a web page
# is blocked: the Laravel code and its .env, this folder, and any dotfile.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /backend/ { return 404; }
    location ^~ /docker/  { return 404; }
    location ~ /\.        { return 404; }
    location ~* \.(md|yml|yaml|sql|sqlite|log|lock)$ { return 404; }

    # Smaller downloads: pages, styles and scripts are compressed
    # (often 70-80% smaller), which matters most on slow connections.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Images and fonts rarely change: the browser keeps them for 7 days.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Styles and scripts: reused for 10 minutes, then checked again,
    # so updates still reach everyone quickly.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=600";
        try_files $uri =404;
    }

    # Pages are always checked, so a new version shows right away.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
