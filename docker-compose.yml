# Siknayan LMS: MySQL + Laravel API + static frontend.
#
#   1. cp .env.example .env     (then set the two passwords inside it)
#   2. docker compose up --build
#   3. docker compose exec backend php artisan db:seed     (first time only)
#
# Frontend: http://localhost:8080   API: http://localhost:8000/api
# Database passwords come from the untracked .env file, never from this file.

services:

  mysql:
    image: mysql:8.4
    container_name: siknayan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-siknayan}
      MYSQL_USER: ${MYSQL_USER:-siknayan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copy .env.example to .env and set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copy .env.example to .env and set MYSQL_ROOT_PASSWORD}
    ports:
      # Reachable from this computer only (for MySQL Workbench), not from the network.
      - "127.0.0.1:3306:3306"
    volumes:
      - siknayan_mysql_data:/var/lib/mysql
    networks:
      - siknayan-network

  backend:
    build:
      context: ./backend
    container_name: siknayan-backend
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-siknayan}
      DB_USERNAME: ${MYSQL_USER:-siknayan}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Proxies allowed to pass the visitor's real IP (X-Forwarded-For).
      # Set when the API is reached through a reverse proxy on the Docker
      # network, e.g. 172.16.0.0/12. Empty: trust none.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - siknayan-network

  web:
    image: nginx:1.27-alpine
    container_name: siknayan-web
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - siknayan-network

networks:
  siknayan-network:
    driver: bridge

volumes:
  siknayan_mysql_data:
