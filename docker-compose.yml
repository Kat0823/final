services:

  mysql:
    image: mysql:8.4
    container_name: siknayan-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: siknayan
      MYSQL_USER: siknayan
      MYSQL_PASSWORD: siknayan_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - siknayan_mysql_data:/var/lib/mysql
    networks:
      - siknayan-network

  backend:
    build:
      context: ./backend
    container_name: siknayan-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    command: php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - siknayan-network

networks:
  siknayan-network:
    driver: bridge

volumes:
  siknayan_mysql_data:
