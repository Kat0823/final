<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siknayan | Reset Password</title>
    <meta http-equiv="refresh" content="0; url=forgot-password.html">
</head>
<body>
    <!-- Passwords are reset by an administrator; see forgot-password.html. -->
    <p>
        Redirecting to <a href="forgot-password.html">password help</a>...
    </p>
    <script>
        // Earlier versions of this page stored a password in the browser.
        try {
            ["studentPassword", "passwordSetupComplete"].forEach(
                (key) => localStorage.removeItem(key)
            );
            ["passwordResetVerified", "resetStudentId"].forEach(
                (key) => sessionStorage.removeItem(key)
            );
        } catch (error) {}
        window.location.replace("forgot-password.html");
    </script>
</body>
</html>
