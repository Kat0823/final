<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MPSU ETEEAP LMS</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <!-- The link in the reset email opens this page; its token is not
         stored anywhere in the browser. -->
    <meta name="referrer" content="no-referrer">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f4f6f5;
        }

        .card {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .logo {
            margin-bottom: 15px;
            text-align: center;
        }

        .logo img {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        h1 {
            margin-bottom: 8px;
            color: #086b3c;
            font-size: 25px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 24px;
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
            font-size: 14px;
            font-weight: bold;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap > i {
            position: absolute;
            top: 50%;
            left: 14px;
            color: #777777;
            transform: translateY(-50%);
        }

        input {
            width: 100%;
            padding: 13px 44px 13px 42px;
            border: 1px solid #cccccc;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #086b3c;
            box-shadow: 0 0 0 3px rgba(8, 107, 60, 0.12);
        }

        .toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #777777;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .toggle:hover {
            background: #e8f5ed;
            color: #086b3c;
        }

        .hint {
            margin-top: -6px;
            margin-bottom: 18px;
            color: #666666;
            font-size: 12px;
        }

        .button {
            display: block;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #086b3c;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #07582f;
        }

        .button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .button:focus-visible,
        .toggle:focus-visible,
        .back-login:focus-visible {
            outline: 2px solid #086b3c;
            outline-offset: 2px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.success {
            background: #e8f5ed;
            color: #086b3c;
        }

        .message.error {
            background: #fdecec;
            color: #a33333;
        }

        .back-login {
            display: block;
            margin-top: 20px;
            color: #086b3c;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .card {
                padding: 25px 20px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">
            <img src="images/logo.png" alt="MPSU logo">
        </div>

        <h1>Set a New Password</h1>
        <p class="subtitle" id="subtitle">Choose a new password for your account.</p>

        <p class="message" id="message" role="status" aria-live="polite" hidden></p>

        <form id="resetForm" novalidate>
            <div class="field">
                <label for="password">New Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <input type="password" id="password" autocomplete="new-password" minlength="8" maxlength="255" required>
                    <button type="button" class="toggle" data-toggle="password" aria-label="Show new password">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <p class="hint">At least 8 characters (System Administrators: at least 15).</p>

            <div class="field">
                <label for="confirm">Confirm New Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <input type="password" id="confirm" autocomplete="new-password" minlength="8" maxlength="255" required>
                    <button type="button" class="toggle" data-toggle="confirm" aria-label="Show password confirmation">
                        <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="button" id="submitButton">
                <i class="fa-solid fa-key" aria-hidden="true"></i>
                <span>Reset Password</span>
            </button>
        </form>

        <a href="index.html" class="button" id="loginButton" hidden>
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Go to Login
        </a>

        <a href="forgot-password.html" class="back-login" id="newLinkLink">
            Need a new link? Request another one
        </a>
        <a href="index.html" class="back-login">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Login
        </a>
    </main>

    <script src="api-config.js"></script>
    <script>
        (function () {
            // Earlier versions of this page stored a password in the browser.
            try {
                ["studentPassword", "passwordSetupComplete"].forEach(key => localStorage.removeItem(key));
                ["passwordResetVerified", "resetStudentId"].forEach(key => sessionStorage.removeItem(key));
            } catch (error) {}

            const params = new URLSearchParams(window.location.search);
            const token = params.get("token") || "";
            const email = params.get("email") || "";

            const form = document.getElementById("resetForm");
            const button = document.getElementById("submitButton");
            const message = document.getElementById("message");

            function show(text, type) {
                message.textContent = text;
                message.className = `message ${type}`;
                message.hidden = false;
            }

            // Keep the token out of the address bar and browser history.
            if (token && window.history.replaceState) {
                window.history.replaceState(null, "", window.location.pathname);
            }

            if (!token || !email) {
                form.hidden = true;
                show("This page needs the link from your reset email. Please request a new link.", "error");
                return;
            }

            document.getElementById("subtitle").textContent = `Choose a new password for ${email}.`;

            document.querySelectorAll("[data-toggle]").forEach(toggle => toggle.addEventListener("click", () => {
                const input = document.getElementById(toggle.dataset.toggle);
                const showing = input.type === "password";
                input.type = showing ? "text" : "password";
                toggle.setAttribute("aria-label", toggle.getAttribute("aria-label").replace(showing ? "Show" : "Hide", showing ? "Hide" : "Show"));
                toggle.innerHTML = `<i class="fa-regular ${showing ? "fa-eye-slash" : "fa-eye"}" aria-hidden="true"></i>`;
            }));

            form.addEventListener("submit", async event => {
                event.preventDefault();
                const password = document.getElementById("password").value;
                const confirmation = document.getElementById("confirm").value;

                if (password.length < 8) return show("The new password must be at least 8 characters.", "error");
                if (password !== confirmation) return show("The new passwords do not match.", "error");

                button.disabled = true;
                button.querySelector("span").textContent = "Saving...";

                try {
                    const response = await fetch(`${window.SIKNAYAN_API_ROOT}/password/reset`, {
                        method: "POST",
                        headers: { Accept: "application/json", "Content-Type": "application/json" },
                        body: JSON.stringify({ token, email, password, password_confirmation: confirmation })
                    });
                    const data = await response.json().catch(() => ({}));

                    if (response.status === 429) {
                        show("Too many attempts. Please wait a minute and try again.", "error");
                    } else if (!response.ok || data.success === false) {
                        const firstError = data.errors ? Object.values(data.errors)[0]?.[0] : null;
                        show(firstError || data.message || "Something went wrong. Please try again.", "error");
                    } else {
                        form.hidden = true;
                        document.getElementById("newLinkLink").hidden = true;
                        document.getElementById("loginButton").hidden = false;
                        show(data.message, "success");
                        return;
                    }
                } catch (error) {
                    show("Cannot reach the server. Please check your connection and try again.", "error");
                }

                button.disabled = false;
                button.querySelector("span").textContent = "Reset Password";
            });
        })();
    </script>
</body>
</html>
