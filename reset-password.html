<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - MPSU ETEEAP LMS</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f4f6f5;

            padding: 20px;

        }


        .reset-container {

            width: 100%;

            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.12);

        }


        .logo {

            text-align: center;

            margin-bottom: 15px;

        }


        .logo img {

            width: 85px;

            height: 85px;

            object-fit: contain;

        }


        h1 {

            text-align: center;

            color: #086b3c;

            margin-bottom: 8px;

        }


        .description {

            text-align: center;

            color: #666;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            color: #333;

            margin-bottom: 8px;

        }


        .password-box {

            position: relative;

        }


        .password-box input {

            width: 100%;

            padding: 13px 45px 13px 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            outline: none;

        }


        .password-box input:focus {

            border-color: #086b3c;

        }


        .toggle-password {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            background: transparent;

            border: none;

            cursor: pointer;

            color: #666;

        }


        .requirements {

            background: #f4f7f5;

            padding: 15px;

            border-radius: 7px;

            margin-bottom: 20px;

        }


        .requirements p {

            font-size: 13px;

            margin-bottom: 8px;

            color: #555;

        }


        .requirement {

            font-size: 13px;

            color: #777;

            margin: 5px 0;

        }


        .requirement.valid {

            color: #086b3c;

            font-weight: bold;

        }


        .strength {

            font-size: 13px;

            color: #666;

            margin-bottom: 20px;

        }


        .strength-bar {

            width: 100%;

            height: 7px;

            background: #ddd;

            border-radius: 5px;

            margin-top: 7px;

            overflow: hidden;

        }


        .strength-progress {

            height: 100%;

            width: 0%;

            background: #086b3c;

            transition: width 0.3s;

        }


        .reset-btn {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #086b3c;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .reset-btn:hover {

            background: #07582f;

        }


        .back-login {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #086b3c;

            text-decoration: none;

            font-size: 14px;

        }


        @media (max-width: 500px) {

            .reset-container {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


    <div class="reset-container">


        <div class="logo">

            <img
                src="images/mpsu-logo.png"
                alt="MPSU Logo"
            >

        </div>


        <h1>
            Reset Password
        </h1>


        <p class="description">

            Create a new secure password for your
            MPSU ETEEAP LMS account.

        </p>


        <form id="resetForm">


            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword(
                            'newPassword',
                            'newPasswordIcon'
                        )"
                    >

                        <i
                            class="fa-solid fa-eye"
                            id="newPasswordIcon"
                        ></i>

                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword(
                            'confirmPassword',
                            'confirmPasswordIcon'
                        )"
                    >

                        <i
                            class="fa-solid fa-eye"
                            id="confirmPasswordIcon"
                        ></i>

                    </button>

                </div>

            </div>


            <div class="requirements">

                <p>
                    Password requirements:
                </p>


                <div
                    class="requirement"
                    id="lengthRequirement"
                >

                    <i class="fa-solid fa-circle-xmark"></i>

                    At least 8 characters

                </div>


                <div
                    class="requirement"
                    id="uppercaseRequirement"
                >

                    <i class="fa-solid fa-circle-xmark"></i>

                    One uppercase letter

                </div>


                <div
                    class="requirement"
                    id="numberRequirement"
                >

                    <i class="fa-solid fa-circle-xmark"></i>

                    One number

                </div>

            </div>


            <div class="strength">

                Password Strength:
                <span id="strengthText">
                    None
                </span>

                <div class="strength-bar">

                    <div
                        class="strength-progress"
                        id="strengthProgress"
                    ></div>

                </div>

            </div>


            <button
                type="submit"
                class="reset-btn"
            >

                Reset Password

            </button>


        </form>


        <a
            href="index.html"
            class="back-login"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Login

        </a>


    </div>


    <script>

        /*
         * Check whether account verification happened.
         */

        const verified =
            sessionStorage.getItem(
                "passwordResetVerified"
            );


        if (verified !== "true") {

            alert(
                "Please verify your account first."
            );

            window.location.href =
                "forgot-password.html";

        }


        const newPassword =
            document.getElementById(
                "newPassword"
            );

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            );

        const strengthText =
            document.getElementById(
                "strengthText"
            );

        const strengthProgress =
            document.getElementById(
                "strengthProgress"
            );


        /*
         * PASSWORD TOGGLE
         */

        function togglePassword(
            inputId,
            iconId
        ) {

            const input =
                document.getElementById(
                    inputId
                );

            const icon =
                document.getElementById(
                    iconId
                );


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove(
                    "fa-eye"
                );

                icon.classList.add(
                    "fa-eye-slash"
                );

            } else {

                input.type = "password";

                icon.classList.remove(
                    "fa-eye-slash"
                );

                icon.classList.add(
                    "fa-eye"
                );

            }

        }


        /*
         * UPDATE PASSWORD STRENGTH
         */

        newPassword.addEventListener(
            "input",
            function () {

                const password =
                    newPassword.value;


                const length =
                    password.length >= 8;

                const uppercase =
                    /[A-Z]/.test(password);

                const number =
                    /[0-9]/.test(password);


                updateRequirement(
                    "lengthRequirement",
                    length
                );

                updateRequirement(
                    "uppercaseRequirement",
                    uppercase
                );

                updateRequirement(
                    "numberRequirement",
                    number
                );


                let strength = 0;


                if (length) {
                    strength++;
                }


                if (uppercase) {
                    strength++;
                }


                if (number) {
                    strength++;
                }


                if (strength === 0) {

                    strengthText.textContent =
                        "None";

                    strengthProgress.style.width =
                        "0%";

                } else if (strength === 1) {

                    strengthText.textContent =
                        "Weak";

                    strengthProgress.style.width =
                        "33%";

                } else if (strength === 2) {

                    strengthText.textContent =
                        "Medium";

                    strengthProgress.style.width =
                        "66%";

                } else {

                    strengthText.textContent =
                        "Strong";

                    strengthProgress.style.width =
                        "100%";

                }

            }
        );


        function updateRequirement(
            id,
            valid
        ) {

            const element =
                document.getElementById(id);

            const icon =
                element.querySelector("i");


            if (valid) {

                element.classList.add(
                    "valid"
                );

                icon.classList.remove(
                    "fa-circle-xmark"
                );

                icon.classList.add(
                    "fa-circle-check"
                );

            } else {

                element.classList.remove(
                    "valid"
                );

                icon.classList.remove(
                    "fa-circle-check"
                );

                icon.classList.add(
                    "fa-circle-xmark"
                );

            }

        }


        /*
         * RESET PASSWORD
         */

        document
            .getElementById("resetForm")
            .addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    const password =
                        newPassword.value;

                    const confirm =
                        confirmPassword.value;


                    const validLength =
                        password.length >= 8;

                    const validUppercase =
                        /[A-Z]/.test(password);

                    const validNumber =
                        /[0-9]/.test(password);


                    if (
                        !validLength ||
                        !validUppercase ||
                        !validNumber
                    ) {

                        alert(
                            "Please meet all password requirements."
                        );

                        return;

                    }


                    if (password !== confirm) {

                        alert(
                            "Passwords do not match."
                        );

                        return;

                    }


                    /*
                     * FRONTEND DEMO ONLY
                     *
                     * Laravel will hash and save this
                     * password in MySQL later.
                     */

                    localStorage.setItem(
                        "studentPassword",
                        password
                    );


                    localStorage.setItem(
                        "passwordSetupComplete",
                        "true"
                    );


                    /*
                     * Clear reset state.
                     */

                    sessionStorage.removeItem(
                        "passwordResetVerified"
                    );

                    sessionStorage.removeItem(
                        "resetStudentId"
                    );

                    sessionStorage.removeItem(
                        "isLoggedIn"
                    );


                    alert(
                        "Password reset successfully. Please login again using your new password."
                    );


                    /*
                     * Return to Login
                     */

                    window.location.href =
                        "index.html";

                }
            );

    </script>

</body>

</html>
