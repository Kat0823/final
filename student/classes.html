<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Classes | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
    <style>
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .search {
            position: relative;
            flex: 1 1 260px;
            max-width: 420px;
        }

        .search i {
            position: absolute;
            top: 50%;
            left: 14px;
            color: var(--muted);
            transform: translateY(-50%);
        }

        .search input {
            width: 100%;
            min-height: 42px;
            padding: 10px 12px 10px 40px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--white);
        }

        .search input:focus {
            outline: 2px solid rgba(8, 104, 60, 0.22);
            border-color: var(--green);
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .class-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            background: var(--white);
            box-shadow: var(--shadow);
            color: inherit;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .class-card:hover,
        .class-card:focus-visible {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
            outline: none;
        }

        .class-card:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 2px;
        }

        .class-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 16px 18px;
            background: var(--green);
            color: var(--white);
        }

        .class-banner .code {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .class-banner i {
            font-size: 20px;
            opacity: 0.85;
        }

        .class-body {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 10px;
            padding: 18px;
        }

        .class-body h3 {
            font-size: 17px;
            line-height: 1.35;
        }

        .class-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .progress {
            margin-top: auto;
            padding-top: 8px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 12px;
        }

        .progress-bar {
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--border-light);
        }

        .progress-bar span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: var(--green);
        }
    </style>
</head>
<body data-page="classes">
    <main class="main-content" id="main">
        <div class="page-header">
            <div>
                <h2>My Classes</h2>
                <p id="classSummary">Loading your classes...</p>
            </div>
        </div>

        <div class="stats" id="stats" hidden>
            <div class="stat"><span>Classes</span><strong id="statClasses">0</strong></div>
            <div class="stat"><span>Modules</span><strong id="statModules">0</strong></div>
            <div class="stat"><span>Submitted</span><strong id="statSubmitted">0</strong></div>
            <div class="stat"><span>Graded</span><strong id="statGraded">0</strong></div>
        </div>

        <div class="toolbar" id="toolbar" hidden>
            <label class="search">
                <span class="visually-hidden">Search classes</span>
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="searchInput" placeholder="Search by class, code or instructor">
            </label>
        </div>

        <div id="classList" class="class-grid" aria-live="polite">
            <div class="card state" style="grid-column: 1 / -1">
                <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
                <h3>Loading classes</h3>
            </div>
        </div>
    </main>

    <script src="../api-config.js"></script>
    <script src="js/portal.js"></script>
    <script src="js/profile-modal.js"></script>
    <script>
        (function () {
            if (!window.Portal) return;
            const { api, escape } = window.Portal;
            const $ = id => document.getElementById(id);
            let classes = [];

            function render() {
                const list = $("classList");
                const query = $("searchInput").value.trim().toLowerCase();

                const shown = classes.filter(item => !query || [
                    item.name, item.code, item.subject_code, item.program, item.instructor?.name
                ].some(value => String(value || "").toLowerCase().includes(query)));

                if (classes.length === 0) {
                    list.innerHTML = `
                        <div class="card state" style="grid-column: 1 / -1">
                            <i class="fa-solid fa-book-open" aria-hidden="true"></i>
                            <h3>You are not enrolled in any class yet</h3>
                            <p>Your classes will appear here once your administrator enrolls you.</p>
                        </div>`;
                    return;
                }

                if (shown.length === 0) {
                    list.innerHTML = `
                        <div class="card state" style="grid-column: 1 / -1">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <h3>No classes match "${escape(query)}"</h3>
                        </div>`;
                    return;
                }

                list.innerHTML = shown.map(item => {
                    const total = item.module_count || 0;
                    const done = Math.min(item.submitted_count || 0, total);
                    const percent = total ? Math.round((done / total) * 100) : 0;

                    return `
                        <a class="class-card" href="modules.html?course=${encodeURIComponent(item.id)}">
                            <div class="class-banner">
                                <span class="code">${escape(item.code || item.subject_code || "CLASS")}</span>
                                <i class="fa-solid fa-book-open" aria-hidden="true"></i>
                            </div>
                            <div class="class-body">
                                <h3>${escape(item.name)}</h3>
                                <span class="class-meta">
                                    <i class="fa-solid fa-chalkboard-user" aria-hidden="true"></i>
                                    ${escape(item.instructor?.name || "No instructor assigned")}
                                </span>
                                <span class="class-meta">
                                    <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
                                    ${total} module${total === 1 ? "" : "s"}${item.graded_count ? ` · ${item.graded_count} graded` : ""}
                                </span>
                                <div class="progress">
                                    <div class="progress-label">
                                        <span>Activities submitted</span>
                                        <span>${done} / ${total}</span>
                                    </div>
                                    <div class="progress-bar" role="progressbar" aria-label="Activities submitted"
                                        aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}">
                                        <span style="width: ${percent}%"></span>
                                    </div>
                                </div>
                            </div>
                        </a>`;
                }).join("");
            }

            async function load() {
                try {
                    const data = await api("/student/courses");
                    classes = Array.isArray(data.courses) ? data.courses : [];

                    const sum = key => classes.reduce((total, item) => total + (item[key] || 0), 0);
                    $("statClasses").textContent = classes.length;
                    $("statModules").textContent = sum("module_count");
                    $("statSubmitted").textContent = sum("submitted_count");
                    $("statGraded").textContent = sum("graded_count");
                    $("stats").hidden = classes.length === 0;
                    $("toolbar").hidden = classes.length === 0;
                    $("classSummary").textContent = classes.length
                        ? `You are enrolled in ${classes.length} class${classes.length === 1 ? "" : "es"}.`
                        : "No classes yet.";

                    render();
                } catch (error) {
                    $("classSummary").textContent = "Unable to load your classes.";
                    $("classList").innerHTML = `
                        <div class="card state" style="grid-column: 1 / -1">
                            <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                            <h3>Unable to load your classes</h3>
                            <p>${escape(error.message)}</p>
                            <button class="btn" type="button" id="retryButton">Try again</button>
                        </div>`;
                    $("retryButton").addEventListener("click", load);
                }
            }

            $("searchInput").addEventListener("input", render);
            load();
        })();
    </script>
</body>
</html>
