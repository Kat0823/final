<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Classes - MPSU ETEEAP LMS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        a {
            text-decoration: none;
        }


        /* =========================================
           HEADER
        ========================================== */

        .header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            background: #086b3c;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            color: white;

            border-radius: 0 0 4px 4px;

            z-index: 1000;
        }


        /* =========================================
           HEADER LEFT
        ========================================== */

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            color: white;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            color: white;
            font-size: 14px;
        }


        /* =========================================
           HEADER RIGHT
        ========================================== */

         .header-right {
            display: flex;

            align-items: center;
        }


        .user-link {
            color: white;

            font-size: 16px;

            text-decoration: underline;

            cursor: pointer;
        }


        .user-link:hover {
            color: #ffd32a;
        }


        /* =========================================
           MAIN LAYOUT
        ========================================== */

        .main {
            width: 100%;

            display: flex;

            min-height: calc(100vh - 84px);

            padding-top: 84px;
        }


        /* =========================================
           SIDEBAR
        ========================================== */

        .sidebar {
            position: fixed;

            top: 84px;
            left: 0;

            width: 270px;
            height: calc(100vh - 84px);

            background: #086b3c;

            padding: 25px 12px;

            border-radius: 0 0 7px 0;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow-y: auto;

            z-index: 900;
        }


        /* =========================================
           SIDEBAR TOP
        ========================================== */

        .sidebar-top {
            display: flex;
            flex-direction: column;
        }


        /* =========================================
           SIDEBAR BOTTOM
        ========================================== */

        .sidebar-bottom {
            margin-top: auto;
        }


        /* =========================================
           VIEW
        ========================================== */

        .view {
            height: 60px;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: white;

            font-size: 20px;

            margin-bottom: 10px;
        }

        .view i {
            font-size: 22px;
            color: white;
        }


        /* =========================================
           SIDEBAR MENU
        ========================================== */

        .menu {
            width: 100%;
            height: 47px;

            display: flex;
            align-items: center;

            gap: 20px;

            padding: 0 25px;

            margin-bottom: 5px;

            border-radius: 9px;

            color: white;

            font-size: 18px;

            transition: 0.2s;

            text-decoration: none;
        }


        /* REMOVE UNDERLINES */

        .menu,
        .menu:hover,
        .menu:focus,
        .menu:active,
        .menu:visited {
            text-decoration: none;
        }

        .menu i {
            width: 22px;

            text-align: center;

            font-size: 19px;
        }

        .menu:hover {
            background: rgba(255, 255, 255, 0.10);
        }


        /* =========================================
           ACTIVE MENU
        ========================================== */

        .menu.active {
            background: #ffd34e;

            color: #222;

            font-weight: normal;
        }

        .menu.active i {
            color: #222;
        }


        /* =========================================
           LOGOUT
        ========================================== */

        .logout-menu {
            margin-bottom: 0;
        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .content {
            margin-left: 270px;

            width: calc(100% - 270px);

            background: white;

            padding: 35px 40px;

            min-width: 0;

            min-height: calc(100vh - 84px);
        }


        /* =========================================
           TITLE
        ========================================== */

        .title-row {
            width: 100%;
            margin-bottom: 18px;
        }

        .title-row h1 {
            color: #222;

            font-size: 32px;

            font-weight: bold;
        }


        /* =========================================
           FEEDBACK
        ========================================== */

        .feedback {
            width: 100%;

            min-height: 42px;

            background: #e0e1e5;

            border-radius: 9px;

            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: #555;

            font-size: 16px;

            margin-bottom: 33px;
        }

        .feedback button {
            border: none;

            background: transparent;

            color: #777;

            font-size: 15px;

            cursor: pointer;

            padding: 5px 8px;
        }

        .feedback button:hover {
            color: #086b3c;

            font-weight: bold;
        }


        /* =========================================
           HORIZONTAL LINE
        ========================================== */

        .content hr {
            width: 100%;

            border: none;

            border-top: 1px solid #999;

            margin-bottom: 20px;
        }


        /* =========================================
           COURSES
        ========================================== */

        .courses {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 23px;
        }


        /* =========================================
           COURSE CARD
        ========================================== */

        .course-card {
            min-height: 140px;

            background: white;

            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 18px;

            display: block;

            color: #222;

            box-shadow:
                0 2px 5px rgba(0, 0, 0, 0.12);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .course-card:hover {
            background: #fbfdfc;

            transform: translateY(-2px);

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.14);
        }


        /* =========================================
           COURSE NAME
        ========================================== */

        .course-card h3 {
            color: #222;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 18px;
        }


        /* =========================================
           INSTRUCTOR
        ========================================== */

        .course-card p {
            color: #777;

            font-size: 15px;

            line-height: 1.4;
        }


        /* =========================================
           TABLET
        ========================================== */

        @media (max-width: 1000px) {

            .sidebar {
                width: 230px;
            }

            .content {
                margin-left: 230px;

                width: calc(100% - 230px);

                padding: 30px;
            }

            .courses {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }
        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 650px) {

            .header {
                position: relative;

                height: auto;

                min-height: 75px;

                padding: 10px 15px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .header-right {
                display: none;
            }


            /* Main becomes vertical */

            .main {
                flex-direction: column;

                padding-top: 0;
            }


            /* Sidebar becomes horizontal */

            .sidebar {
                position: relative;

                top: auto;
                left: auto;

                width: 100%;

                height: auto;

                min-height: auto;

                display: flex;

                flex-direction: row;

                overflow-x: auto;

                padding: 8px;

                gap: 5px;

                border-radius: 0;

                justify-content: flex-start;
            }


            .sidebar-top {
                display: flex;

                flex-direction: row;

                gap: 5px;
            }


            .sidebar-bottom {
                margin-top: 0;
            }


            .view {
                display: none;
            }


            .menu {
                min-width: 105px;

                justify-content: center;

                padding: 10px;

                margin: 0;

                font-size: 13px;
            }


            /* Content */

            .content {
                margin-left: 0;

                width: 100%;

                padding: 20px 15px;
            }

            .title-row h1 {
                font-size: 27px;
            }

            .feedback {
                font-size: 13px;

                min-height: 45px;

                padding: 0 13px;
            }

            .courses {
                grid-template-columns: 1fr;

                gap: 15px;
            }

            .course-card {
                min-height: 120px;
            }
        }


        /* =========================================
           SMALL MOBILE
        ========================================== */

        @media (max-width: 400px) {

            .brand-title {
                font-size: 14px;
            }

            .brand-subtitle {
                display: none;
            }

            .menu {
                min-width: 90px;

                font-size: 11px;
            }

            .menu i {
                font-size: 14px;
            }

            .title-row h1 {
                font-size: 24px;
            }

            .course-card h3 {
                font-size: 18px;
            }

            .course-card p {
                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div class="header-titles">

                <h1 class="brand-title">
                    MPSU ETEEAP LMS
                </h1>

                <p class="brand-subtitle">
                    Mountain Province State University
                </p>

            </div>

        </div>


        <div class="header-right">

            <a
                href="profile.html"
                class="user-link">

                Macross Arsel

            </a>

        </div>

    </header>


    <!-- =========================================
         MAIN
    ========================================== -->

    <div class="main">


        <!-- =========================================
             SIDEBAR
        ========================================== -->

        <aside class="sidebar">


            <!-- TOP MENU -->

            <div class="sidebar-top">

                <div class="view">

                    <span>
                        View
                    </span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>


                <a
                    href="classes.html"
                    class="menu active">

                    <i class="fa-regular fa-folder"></i>

                    <span>
                        Classes
                    </span>

                </a>


                <a
                    href="grades.html"
                    class="menu">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Grades
                    </span>

                </a>


                <a
                    href="notification.html"
                    class="menu">

                    <i class="fa-regular fa-bell"></i>

                    <span>
                        Notifications
                    </span>

                </a>


                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>
                        Profile
                    </span>

                </a>

            </div>


            <!-- BOTTOM MENU -->

            <div class="sidebar-bottom">

                <a
                    href="logout.html"
                    class="menu logout-menu">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </aside>


        <!-- =========================================
             CONTENT
        ========================================== -->

        <main class="content">


            <!-- TITLE -->

            <div class="title-row">

                <h1>
                    Classes
                </h1>

            </div>


            <!-- FEEDBACK -->

            <div
                class="feedback"
                id="feedback">

                <span>
                    New Feedback on Intro to Computing
                </span>

                <button
                    type="button"
                    onclick="dismissFeedback()">

                    Dismiss

                </button>

            </div>


            <!-- LINE -->

            <hr>


            <!-- =========================================
                 COURSES
            ========================================== -->

            <div class="courses">


                <!-- COURSE 1 -->

                <a
                    href="courses.html"
                    class="course-card">

                    <h3>
                        CRIM -A
                    </h3>

                    <p>
                        Kim Reyes
                    </p>

                </a>


                <!-- COURSE 2 -->

                <a
                    href="courses.html"
                    class="course-card">

                    <h3>
                        CRIM1
                    </h3>

                    <p>
                        Jennifer Lopez
                    </p>

                </a>


                <!-- COURSE 3 -->

                <a
                    href="courses.html"
                    class="course-card">

                    <h3>
                        CRIM 2
                    </h3>

                    <p>
                        Patricia Flores
                    </p>

                </a>


            </div>


        </main>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        function dismissFeedback() {

            const feedback =
                document.getElementById("feedback");

            if (feedback) {

                feedback.style.display = "none";

            }

        }

    </script>


</body>

</html>
