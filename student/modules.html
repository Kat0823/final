<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Course Modules - MPSU ETEEAP LMS</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        a {
            text-decoration: none;
        }

        /* HEADER */

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 84px;
            background: #086b3c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 38px;
            color: white;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            color: white;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            color: white;
            font-size: 14px;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        .user-link {
            color: white;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
        }

        .user-link:hover {
            color: #ffd32a;
        }

        /* MAIN */

        .main {
            width: 100%;
            display: flex;
            min-height: calc(100vh - 84px);
            padding-top: 84px;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 84px;
            left: 0;
            width: 270px;
            height: calc(100vh - 84px);
            background: #086b3c;
            padding: 25px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            z-index: 900;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .view {
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .view i {
            font-size: 22px;
            color: white;
        }

        .menu {
            width: 100%;
            height: 47px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 25px;
            margin-bottom: 5px;
            border-radius: 9px;
            color: white;
            font-size: 18px;
            transition: 0.2s;
        }

        .menu,
        .menu:hover,
        .menu:focus,
        .menu:active,
        .menu:visited {
            text-decoration: none;
        }

        .menu i {
            width: 22px;
            text-align: center;
            font-size: 19px;
        }

        .menu:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .menu.active {
            background: #ffd34e;
            color: #222;
        }

        .menu.active i {
            color: #222;
        }

        /* CONTENT */

        .content {
            margin-left: 270px;
            width: calc(100% - 270px);
            background: white;
            padding: 35px 40px;
            min-width: 0;
            min-height: calc(100vh - 84px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #086b3c;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 8px;
        }

        .title-row h1 {
            color: #222;
            font-size: 32px;
            font-weight: bold;
        }

        .program {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .content hr {
            width: 100%;
            border: none;
            border-top: 1px solid #999;
            margin-bottom: 25px;
        }

        /* COURSE INFORMATION */

        .course-info {
            width: 100%;
            border: 2px solid #35a36b;
            border-radius: 9px;
            padding: 20px;
            margin-bottom: 25px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.10);
        }

        .course-info h2 {
            font-size: 21px;
            margin-bottom: 8px;
            color: #086b3c;
        }

        .course-info p {
            color: #555;
            line-height: 1.5;
        }

        /* MODULES */

        .section-title {
            font-size: 23px;
            margin-bottom: 18px;
            color: #222;
        }

        .modules {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .module-card {
            border: 2px solid #35a36b;
            border-radius: 9px;
            padding: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.10);
        }

        .module-card:hover {
            background: #fbfdfc;
        }

        .module-number {
            color: #086b3c;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .module-card h3 {
            font-size: 19px;
            margin-bottom: 10px;
        }

        .module-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .module-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .module-button {
            border: none;
            background: #086b3c;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .module-button:hover {
            background: #064f2d;
        }

        .module-button.secondary {
            background: #ffd34e;
            color: #222;
        }

        .module-button.secondary:hover {
            background: #f0c32d;
        }

        /* SUBMISSION */

        .submission-box {
            width: 100%;
            border: 1px solid #d5d5d5;
            border-radius: 9px;
            padding: 20px;
            background: #f8f8f8;
            margin-top: 20px;
        }

        .submission-box h2 {
            font-size: 21px;
            margin-bottom: 15px;
        }

        .submission-box label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .submission-box input[type="file"] {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .submission-box textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: Arial, sans-serif;
            margin-bottom: 15px;
        }

        .submit-button {
            border: none;
            background: #086b3c;
            color: white;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .submit-button:hover {
            background: #064f2d;
        }

        /* STATUS */

        .status-message {
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 20px;
            background: #f0f0f0;
            color: #555;
            display: none;
        }

        .status-message.error {
            display: block;
            background: #ffe8e8;
            color: #a00000;
        }

        .status-message.loading {
            display: block;
            background: #eef7f2;
            color: #086b3c;
        }

        .empty-message {
            border: 1px dashed #aaa;
            padding: 25px;
            text-align: center;
            color: #777;
            border-radius: 8px;
            background: #fafafa;
        }

        /* RESPONSIVE */

        @media (max-width: 1000px) {

            .sidebar {
                width: 230px;
            }

            .content {
                margin-left: 230px;
                width: calc(100% - 230px);
                padding: 30px;
            }

            .modules {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {

            .header {
                position: relative;
                height: auto;
                min-height: 75px;
                padding: 10px 15px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .header-right {
                display: none;
            }

            .main {
                flex-direction: column;
                padding-top: 0;
            }

            .sidebar {
                position: relative;
                top: auto;
                left: auto;
                width: 100%;
                height: auto;
                min-height: auto;
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                padding: 8px;
                gap: 5px;
                border-radius: 0;
                justify-content: flex-start;
            }

            .sidebar-top {
                display: flex;
                flex-direction: row;
                gap: 5px;
            }

            .sidebar-bottom {
                margin-top: 0;
            }

            .view {
                display: none;
            }

            .menu {
                min-width: 105px;
                justify-content: center;
                padding: 10px;
                margin: 0;
                font-size: 13px;
            }

            .content {
                margin-left: 0;
                width: 100%;
                padding: 20px 15px;
            }

            .title-row {
                align-items: flex-start;
            }

            .title-row h1 {
                font-size: 26px;
            }

            .course-info {
                padding: 16px;
            }

            .module-card {
                padding: 16px;
            }
        }

        @media (max-width: 400px) {

            .brand-title {
                font-size: 14px;
            }

            .brand-subtitle {
                display: none;
            }

            .menu {
                min-width: 90px;
                font-size: 11px;
            }

            .menu i {
                font-size: 14px;
            }

            .title-row h1 {
                font-size: 23px;
            }

            .module-card h3 {
                font-size: 17px;
            }
        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div class="header-titles">

                <h1 class="brand-title">
                    MPSU ETEEAP LMS
                </h1>

                <p class="brand-subtitle">
                    Mountain Province State University
                </p>

            </div>

        </div>

        <div class="header-right">

            <a
                href="profile.html"
                class="user-link">
                Macross Arsel
            </a>

        </div>

    </header>


    <!-- MAIN -->

    <div class="main">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-top">

                <div class="view">

                    <span>View</span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>

                <a
                    href="classes.html"
                    class="menu active">

                    <i class="fa-regular fa-folder"></i>

                    <span>Classes</span>

                </a>

                <a
                    href="grades.html"
                    class="menu">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>Grades</span>

                </a>

                <a
                    href="notification.html"
                    class="menu">

                    <i class="fa-regular fa-bell"></i>

                    <span>Notifications</span>

                </a>

                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>Profile</span>

                </a>

            </div>

            <div class="sidebar-bottom">

                <a
                    href="logout.html"
                    class="menu">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>Logout</span>

                </a>

            </div>

        </aside>


        <!-- CONTENT -->

        <main class="content">

            <a
                href="courses.html"
                class="back-link">

                <i class="fa-solid fa-arrow-left"></i>

                Back to My Course Modules

            </a>


            <div class="title-row">

                <h1 id="courseTitle">
                    Loading course...
                </h1>

            </div>


            <p
                class="program"
                id="courseProgram">
                Loading program...
            </p>


            <div
                id="statusMessage"
                class="status-message">
            </div>


            <hr>


            <!-- COURSE INFORMATION -->

            <div
                class="course-info"
                id="courseInfo">

                <h2>
                    Course Information
                </h2>

                <p id="courseDescription">
                    Loading course information...
                </p>

            </div>


            <!-- MODULES -->

            <h2 class="section-title">
                Available Modules
            </h2>


            <div
                class="modules"
                id="modulesContainer">

                <div class="empty-message">

                    Loading modules...

                </div>

            </div>


            <!-- SUBMISSION -->

            <div class="submission-box">

                <h2>
                    Submit Work
                </h2>

                <label for="fileInput">
                    Select File
                </label>

                <input
                    type="file"
                    id="fileInput"
                    accept=".pdf,.doc,.docx">


                <label for="commentInput">
                    Comment
                </label>

                <textarea
                    id="commentInput"
                    placeholder="Add a comment about your submission...">
                </textarea>


                <button
                    type="button"
                    class="submit-button"
                    onclick="submitWork()">

                    <i class="fa-solid fa-paper-plane"></i>

                    Submit Work

                </button>

            </div>

        </main>

    </div>


    <script>

        /*
            Laravel API
        */

        const API_BASE_URL = "http://localhost:8000";


        /*
            Get course ID from URL

            Example:

            modules.html?course=1

            courseId = 1
        */

        const urlParams =
            new URLSearchParams(window.location.search);

        const courseId =
            urlParams.get("course");


        /*
            Page elements
        */

        const courseTitle =
            document.getElementById("courseTitle");

        const courseProgram =
            document.getElementById("courseProgram");

        const courseDescription =
            document.getElementById("courseDescription");

        const modulesContainer =
            document.getElementById("modulesContainer");

        const statusMessage =
            document.getElementById("statusMessage");


        /*
            Show status message
        */

        function showStatus(message, type) {

            statusMessage.textContent = message;

            statusMessage.className =
                "status-message " + type;

        }


        /*
            Load selected course
        */

        async function loadCourse() {

            if (!courseId) {

                courseTitle.textContent =
                    "Course Not Found";

                courseProgram.textContent =
                    "";

                courseDescription.textContent =
                    "No course was selected.";

                modulesContainer.innerHTML = `
                    <div class="empty-message">
                        Please return to My Course Modules
                        and select a course.
                    </div>
                `;

                return;
            }


            showStatus(
                "Loading course information...",
                "loading"
            );


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/student/courses/${courseId}`
                    );


                if (!response.ok) {

                    throw new Error(
                        "Course could not be loaded."
                    );

                }


                const data =
                    await response.json();


                if (!data.success || !data.course) {

                    throw new Error(
                        "Invalid course data received."
                    );

                }


                const course =
                    data.course;


                /*
                    Course information
                */

                courseTitle.textContent =
                    course.name || "Course";


                courseProgram.textContent =
                    course.program
                    ? `Program: ${course.program}`
                    : "Program not specified";


                courseDescription.textContent =
                    course.description
                    || "No course description available.";


                /*
                    Load modules
                */

                displayModules(
                    course.modules || []
                );


                statusMessage.style.display =
                    "none";

            }

            catch (error) {

                console.error(error);

                showStatus(
                    "Unable to load the course. Please make sure the Laravel server is running.",
                    "error"
                );

                modulesContainer.innerHTML = `
                    <div class="empty-message">
                        Unable to load modules.
                        <br><br>
                        Please try again.
                        <br><br>
                        <button
                            type="button"
                            class="module-button"
                            onclick="loadCourse()">
                            <i class="fa-solid fa-rotate"></i>
                            Retry
                        </button>
                    </div>
                `;

            }

        }


        /*
            Display modules
        */

        function displayModules(modules) {

            modulesContainer.innerHTML = "";


            if (modules.length === 0) {

                modulesContainer.innerHTML = `
                    <div class="empty-message">
                        No published modules are available
                        for this course yet.
                    </div>
                `;

                return;
            }


            modules.forEach(function(module, index) {

                const moduleCard =
                    document.createElement("div");

                moduleCard.className =
                    "module-card";


                const moduleNumber =
                    module.module_order
                    || index + 1;


                moduleCard.innerHTML = `

                    <div class="module-number">
                        MODULE ${moduleNumber}
                    </div>

                    <h3>
                        ${escapeHtml(
                            module.title
                            || "Untitled Module"
                        )}
                    </h3>

                    <p>
                        ${escapeHtml(
                            module.description
                            || "No description available."
                        )}
                    </p>

                    <div class="module-buttons">

                        ${
                            module.material_path
                            ?
                            `
                            <button
                                type="button"
                                class="module-button"
                                onclick="viewMaterial('${escapeAttribute(module.material_path)}')">

                                <i class="fa-regular fa-file"></i>

                                View Material

                            </button>
                            `
                            :
                            `
                            <button
                                type="button"
                                class="module-button secondary"
                                disabled>

                                <i class="fa-regular fa-file"></i>

                                No Material

                            </button>
                            `
                        }

                        <button
                            type="button"
                            class="module-button secondary"
                            onclick="selectModule(${module.id})">

                            <i class="fa-solid fa-upload"></i>

                            Submit Work

                        </button>

                    </div>

                `;


                modulesContainer.appendChild(
                    moduleCard
                );

            });

        }


        /*
            View module material
        */

        function viewMaterial(path) {

            if (!path) {

                alert(
                    "No material has been uploaded for this module yet."
                );

                return;
            }


            /*
                Later, Laravel storage URLs
                can be connected here.

                For now this opens the path
                returned by the database.
            */

            const materialUrl =
                `${API_BASE_URL}/storage/${path}`;


            window.open(
                materialUrl,
                "_blank"
            );

        }


        /*
            Select module for submission
        */

        function selectModule(moduleId) {

            /*
                Store selected module temporarily
                so the submission button knows
                which module is being submitted.
            */

            window.selectedModuleId =
                moduleId;


            document
                .getElementById("fileInput")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });


            document
                .getElementById("fileInput")
                .focus();


            showStatus(
                "Module selected. Please choose your file and add a comment.",
                "loading"
            );

        }


        /*
            Submit work

            NOTE:
            This currently checks the file only.

            The actual upload will be connected
            to Laravel in the next backend step.
        */

        function submitWork() {

            const fileInput =
                document.getElementById("fileInput");

            const commentInput =
                document.getElementById("commentInput");


            if (!window.selectedModuleId) {

                alert(
                    "Please select a module first."
                );

                return;
            }


            if (!fileInput.files.length) {

                alert(
                    "Please select a file first."
                );

                return;
            }


            const file =
                fileInput.files[0];


            const allowedTypes = [
                "application/pdf",
                "application/msword",
                "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            ];


            if (!allowedTypes.includes(file.type)) {

                alert(
                    "Please select a PDF, DOC, or DOCX file."
                );

                return;
            }


            /*
                Temporary frontend message.

                Laravel file upload will be added
                in the next step.
            */

            alert(
                "The file is ready to be submitted. Laravel file upload will be connected next."
            );

        }


        /*
            Prevent HTML injection
        */

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
            Escape values used inside attributes
        */

        function escapeAttribute(value) {

            return String(value)
                .replace(/\\/g, "\\\\")
                .replace(/'/g, "\\'");

        }


        /*
            Load the course when page opens
        */

        loadCourse();

    </script>

</body>

</html>
