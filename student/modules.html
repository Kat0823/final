<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Course Modules - MPSU ETEEAP LMS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        a {
            text-decoration: none;
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            background: #086b3c;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            color: white;

            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 14px;
        }

        .user-link {
            color: white;
            text-decoration: underline;
            font-size: 16px;
        }

        .user-link:hover {
            color: #ffd34e;
        }


        /* ================================
           MAIN
        ================================= */

        .main {
            display: flex;

            min-height: 100vh;

            padding-top: 84px;
        }


        /* ================================
           SIDEBAR
        ================================= */

        .sidebar {
            position: fixed;

            top: 84px;
            left: 0;

            width: 270px;
            height: calc(100vh - 84px);

            background: #086b3c;

            padding: 25px 12px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow-y: auto;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
        }

        .view {
            height: 60px;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: white;

            font-size: 20px;

            margin-bottom: 10px;
        }

        .view i {
            font-size: 22px;
        }

        .menu {
            width: 100%;
            height: 47px;

            display: flex;
            align-items: center;

            gap: 20px;

            padding: 0 25px;

            margin-bottom: 5px;

            border-radius: 9px;

            color: white;

            font-size: 18px;

            text-decoration: none;
        }

        .menu:hover {
            background: rgba(255,255,255,0.10);
        }

        .menu.active {
            background: #ffd34e;
            color: #222;
        }

        .menu i {
            width: 22px;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
        }


        /* ================================
           CONTENT
        ================================= */

        .content {
            margin-left: 270px;

            width: calc(100% - 270px);

            padding: 35px 40px;

            min-height: calc(100vh - 84px);
        }


        /* ================================
           BACK BUTTON
        ================================= */

        .back-button {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #086b3c;

            font-size: 15px;

            margin-bottom: 20px;
        }

        .back-button:hover {
            text-decoration: underline;
        }


        /* ================================
           COURSE HEADER
        ================================= */

        .course-header {
            width: 100%;

            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 25px;

            margin-bottom: 30px;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.10);
        }

        .course-header h1 {
            font-size: 30px;

            margin-bottom: 8px;
        }

        .course-code {
            color: #086b3c;

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .course-program {
            color: #666;

            margin-bottom: 12px;
        }

        .course-description {
            color: #555;

            line-height: 1.5;
        }

        .instructor {
            margin-top: 15px;

            color: #555;
        }

        .instructor i {
            color: #086b3c;

            margin-right: 6px;
        }


        /* ================================
           MODULE TITLE
        ================================= */

        .section-title {
            font-size: 24px;

            margin-bottom: 18px;
        }


        /* ================================
           MODULE LIST
        ================================= */

        .modules {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .module-card {
            width: 100%;

            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 20px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            background: white;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.08);
        }

        .module-card:hover {
            background: #fbfdfc;
        }

        .module-left {
            display: flex;

            align-items: flex-start;

            gap: 15px;

            flex: 1;
        }

        .module-icon {
            width: 45px;
            height: 45px;

            flex-shrink: 0;

            background: #086b3c;

            color: white;

            border-radius: 7px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .module-info h3 {
            font-size: 19px;

            margin-bottom: 7px;
        }

        .module-info p {
            color: #666;

            font-size: 14px;

            line-height: 1.4;
        }


        /* ================================
           MODULE BUTTON
        ================================= */

        .module-button {
            background: #086b3c;

            color: white;

            border: none;

            padding: 10px 17px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;

            white-space: nowrap;
        }

        .module-button:hover {
            background: #064d2c;
        }


        /* ================================
           LOADING
        ================================= */

        .loading,
        .empty-state,
        .error-state {
            width: 100%;

            text-align: center;

            padding: 50px 20px;

            color: #777;
        }

        .loading i,
        .empty-state i,
        .error-state i {
            display: block;

            font-size: 40px;

            color: #086b3c;

            margin-bottom: 15px;
        }

        .empty-state h3,
        .error-state h3 {
            color: #222;

            margin-bottom: 10px;
        }

        .empty-state p,
        .error-state p {
            margin-bottom: 15px;
        }

        .error-state button {
            background: #086b3c;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 6px;

            cursor: pointer;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 1000px) {

            .sidebar {
                width: 230px;
            }

            .content {
                margin-left: 230px;

                width: calc(100% - 230px);

                padding: 30px;
            }
        }


        @media (max-width: 650px) {

            .header {
                position: relative;

                height: auto;

                min-height: 75px;

                padding: 10px 15px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .header-right {
                display: none;
            }

            .main {
                flex-direction: column;

                padding-top: 0;
            }

            .sidebar {
                position: relative;

                top: auto;
                left: auto;

                width: 100%;

                height: auto;

                display: flex;

                flex-direction: row;

                overflow-x: auto;

                padding: 8px;
            }

            .sidebar-top {
                display: flex;

                flex-direction: row;
            }

            .sidebar-bottom {
                margin-top: 0;
            }

            .view {
                display: none;
            }

            .menu {
                min-width: 105px;

                justify-content: center;

                padding: 10px;

                font-size: 13px;

                margin: 0 3px;
            }

            .content {
                margin-left: 0;

                width: 100%;

                padding: 20px 15px;
            }

            .course-header h1 {
                font-size: 24px;
            }

            .module-card {
                flex-direction: column;

                align-items: stretch;
            }

            .module-button {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div class="header-titles">

                <div class="brand-title">
                    MPSU ETEEAP LMS
                </div>

                <div class="brand-subtitle">
                    Mountain Province State University
                </div>

            </div>

        </div>


        <div class="header-right">

            <a
                href="profile.html"
                class="user-link">

                Macross Arsel

            </a>

        </div>

    </header>



    <!-- MAIN -->

    <div class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-top">

                <div class="view">

                    <span>
                        View
                    </span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>


                <a
                    href="classes.html"
                    class="menu active">

                    <i class="fa-regular fa-folder"></i>

                    <span>
                        Classes
                    </span>

                </a>


                <a
                    href="grades.html"
                    class="menu">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Grades
                    </span>

                </a>


                <a
                    href="notification.html"
                    class="menu">

                    <i class="fa-regular fa-bell"></i>

                    <span>
                        Notifications
                    </span>

                </a>


                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>
                        Profile
                    </span>

                </a>

            </div>


            <div class="sidebar-bottom">

                <a
                    href="logout.html"
                    class="menu">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </aside>



        <!-- CONTENT -->

        <main class="content">


            <a
                href="classes.html"
                class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Classes

            </a>


            <!-- COURSE INFORMATION -->

            <div
                class="course-header"
                id="courseHeader">

                <div class="loading">

                    <i
                        class="fa-solid fa-spinner fa-spin">
                    </i>

                    Loading course...

                </div>

            </div>


            <!-- MODULES -->

            <h2 class="section-title">
                Course Modules
            </h2>


            <div
                class="modules"
                id="modulesContainer">

                <div class="loading">

                    <i
                        class="fa-solid fa-spinner fa-spin">
                    </i>

                    Loading modules...

                </div>

            </div>


        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="../api-config.js"></script>
    <script>

        const API_BASE_URL =
            window.SIKNAYAN_API_ORIGIN;


        /* =================================
           GET COURSE ID
        ================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const courseId =
            params.get("course");


        const courseHeader =
            document.getElementById(
                "courseHeader"
            );


        const modulesContainer =
            document.getElementById(
                "modulesContainer"
            );


        /* =================================
           CHECK COURSE ID
        ================================= */

        if (!courseId) {

            showError(
                "Course ID is missing."
            );

        } else {

            loadCourse();

        }


        /* =================================
           LOAD COURSE
        ================================= */

        async function loadCourse() {

            const token =
                sessionStorage.getItem(
                    "authToken"
                );


            /* -----------------------------
               CHECK LOGIN
            ----------------------------- */

            if (!token) {

                window.location.href =
                    "../index.html";

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/student/courses/${courseId}`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                /* -----------------------------
                   AUTH ERROR
                ----------------------------- */

                if (
                    response.status === 401
                ) {

                    sessionStorage.removeItem(
                        "authToken"
                    );

                    sessionStorage.removeItem(
                        "user"
                    );

                    window.location.href =
                        "../index.html";

                    return;
                }


                /* -----------------------------
                   OTHER ERROR
                ----------------------------- */

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load course."
                    );

                }


                const course =
                    data.course;


                /* -----------------------------
                   COURSE HEADER
                ----------------------------- */

                const instructor =
                    course.instructor
                        ? course.instructor.name
                        : "No instructor assigned";


                courseHeader.innerHTML = `

                    <h1>
                        ${escapeHtml(
                            course.name
                        )}
                    </h1>

                    <div class="course-code">

                        ${escapeHtml(
                            course.code
                        )}

                    </div>

                    <div class="course-program">

                        Program:
                        ${escapeHtml(
                            course.program ||
                            "ETEEAP"
                        )}

                    </div>

                    <div class="course-description">

                        ${escapeHtml(
                            course.description ||
                            "No course description available."
                        )}

                    </div>

                    <div class="instructor">

                        <i
                            class="fa-solid fa-user">
                        </i>

                        Instructor:
                        ${escapeHtml(
                            instructor
                        )}

                    </div>

                `;


                /* -----------------------------
                   LOAD MODULES
                ----------------------------- */

                renderModules(
                    course.modules || []
                );


            } catch (error) {

                console.error(error);

                showError(
                    error.message
                );

            }

        }


        /* =================================
           RENDER MODULES
        ================================= */

        function renderModules(modules) {

            if (
                !modules ||
                modules.length === 0
            ) {

                modulesContainer.innerHTML = `

                    <div class="empty-state">

                        <i
                            class="fa-solid fa-book-open">
                        </i>

                        <h3>
                            No Modules Available
                        </h3>

                        <p>
                            There are currently no
                            published modules for this course.
                        </p>

                    </div>

                `;

                return;
            }


            modulesContainer.innerHTML = "";


            modules.forEach(
                (module, index) => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "module-card";


                    card.innerHTML = `

                        <div class="module-left">

                            <div class="module-icon">

                                <i
                                    class="fa-solid fa-book">
                                </i>

                            </div>


                            <div class="module-info">

                                <h3>

                                    ${escapeHtml(
                                        module.name
                                    )}

                                </h3>


                                <p>

                                    ${escapeHtml(
                                        module.description ||
                                        "No description available."
                                    )}

                                </p>

                            </div>

                        </div>


                        <button
                            type="button"
                            class="module-button"
                            onclick="openModule(${module.id})">

                            <i
                                class="fa-solid fa-eye">
                            </i>

                            View Module

                        </button>

                    `;


                    modulesContainer.appendChild(
                        card
                    );

                }
            );

        }


        /* =================================
           OPEN MODULE
        ================================= */

        function openModule(moduleId) {

            /*
             * For now, send the learner to
             * the submission page with the
             * module ID.
             *
             * We will connect this to the
             * real module/submission backend
             * in the next step.
             */

            window.location.href =
                `submission.html?module=${moduleId}`;

        }


        /* =================================
           ERROR
        ================================= */

        function showError(message) {

            courseHeader.innerHTML = `

                <div class="error-state">

                    <i
                        class="fa-solid fa-triangle-exclamation">
                    </i>

                    <h3>
                        Unable to Load Course
                    </h3>

                    <p>
                        ${escapeHtml(message)}
                    </p>

                    <button
                        onclick="loadCourse()">

                        <i
                            class="fa-solid fa-rotate">
                        </i>

                        Try Again

                    </button>

                </div>

            `;


            modulesContainer.innerHTML = "";

        }


        /* =================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
