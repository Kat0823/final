<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Grades - MPSU ETEEAP LMS</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        a {
            text-decoration: none;
        }


        /* HEADER */

        .header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            background: #086b3c;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            color: white;

            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 14px;
        }

        .user-link {
            color: white;
        }

        .user-link:hover {
            text-decoration: underline;
        }


        /* MAIN */

        .main {
            display: flex;
            min-height: 100vh;
            padding-top: 84px;
        }


        /* SIDEBAR */

        .sidebar {
            position: fixed;

            top: 84px;
            left: 0;

            width: 270px;
            height: calc(100vh - 84px);

            background: #086b3c;

            padding: 25px 12px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .view {
            height: 60px;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: white;

            font-size: 20px;
        }

        .menu {
            width: 100%;
            height: 47px;

            display: flex;
            align-items: center;

            gap: 20px;

            padding: 0 25px;

            margin-bottom: 5px;

            border-radius: 9px;

            color: white;

            font-size: 18px;
        }

        .menu:hover {
            background: rgba(255,255,255,0.10);
        }

        .menu.active {
            background: #ffd34e;
            color: #222;
        }

        .menu i {
            width: 22px;
            text-align: center;
        }


        /* CONTENT */

        .content {
            margin-left: 270px;

            width: calc(100% - 270px);

            min-height: calc(100vh - 84px);

            padding: 35px 40px;
        }

        .content h1 {
            font-size: 30px;
            margin-bottom: 25px;
        }


        /* SUMMARY */

        .summary {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .summary-card {
            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 20px;

            background: white;
        }

        .summary-card h3 {
            font-size: 15px;

            color: #666;

            margin-bottom: 8px;
        }

        .summary-card p {
            font-size: 28px;

            font-weight: bold;

            color: #086b3c;
        }


        /* GRADES */

        .grades-container {
            border: 2px solid #35a36b;

            border-radius: 9px;

            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 850px;
        }

        th {
            background: #086b3c;

            color: white;

            text-align: left;

            padding: 15px;
        }

        td {
            padding: 15px;

            border-bottom: 1px solid #ddd;

            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #f7f7f7;
        }


        /* SCORE */

        .score {
            font-weight: bold;

            color: #086b3c;
        }

        .percentage {
            font-weight: bold;
        }


        /* FEEDBACK */

        .feedback {
            max-width: 280px;

            color: #666;

            line-height: 1.4;
        }


        /* STATES */

        .loading,
        .empty-state,
        .error-state {
            padding: 30px;

            text-align: center;

            color: #666;
        }

        .loading i {
            margin-right: 8px;
        }

        .error-state {
            color: #9b2525;
        }


        /* MOBILE */

        @media (max-width: 800px) {

            .summary {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 650px) {

            .header {
                position: relative;

                height: auto;

                min-height: 75px;

                padding: 10px 15px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .header-right {
                display: none;
            }

            .main {
                padding-top: 0;

                display: block;
            }

            .sidebar {
                position: relative;

                top: auto;
                left: auto;

                width: 100%;

                height: auto;

                flex-direction: row;

                overflow-x: auto;

                padding: 8px;
            }

            .view {
                display: none;
            }

            .menu {
                min-width: 105px;

                justify-content: center;

                font-size: 13px;

                padding: 10px;

                margin: 0 3px;
            }

            .content {
                margin-left: 0;

                width: 100%;

                padding: 20px 15px;
            }

            .content h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div>

                <div class="brand-title">
                    MPSU ETEEAP LMS
                </div>

                <div class="brand-subtitle">
                    Mountain Province State University
                </div>

            </div>

        </div>


        <div class="header-right">

            <a
                href="profile.html"
                class="user-link"
                id="userName">

                Learner

            </a>

        </div>

    </header>



    <!-- MAIN -->

    <div class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="view">

                    <span>
                        View
                    </span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>


                <a
                    href="classes.html"
                    class="menu">

                    <i class="fa-regular fa-folder"></i>

                    <span>
                        Classes
                    </span>

                </a>


                <a
                    href="grades.html"
                    class="menu active">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Grades
                    </span>

                </a>


                <a
                    href="notification.html"
                    class="menu">

                    <i class="fa-regular fa-bell"></i>

                    <span>
                        Notifications
                    </span>

                </a>


                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>
                        Profile
                    </span>

                </a>

            </div>


            <div>

                <a
                    href="logout.html"
                    class="menu">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </aside>



        <!-- CONTENT -->

        <main class="content">

            <h1>
                Grades
            </h1>


            <!-- SUMMARY -->

            <div class="summary">

                <div class="summary-card">

                    <h3>
                        Graded Activities
                    </h3>

                    <p id="gradedCount">
                        0
                    </p>

                </div>


                <div class="summary-card">

                    <h3>
                        Average Score
                    </h3>

                    <p id="averageScore">
                        0%
                    </p>

                </div>


                <div class="summary-card">

                    <h3>
                        Latest Grade
                    </h3>

                    <p id="latestGrade">
                        --
                    </p>

                </div>

            </div>



            <!-- GRADES TABLE -->

            <div class="grades-container">

                <div
                    id="loading"
                    class="loading">

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading grades...

                </div>


                <div
                    id="emptyState"
                    class="empty-state"
                    style="display: none;">

                    <i class="fa-solid fa-chart-column"></i>

                    <p style="margin-top: 10px;">
                        No graded activities yet.
                    </p>

                </div>


                <div
                    id="errorState"
                    class="error-state"
                    style="display: none;">

                </div>


                <table
                    id="gradesTable"
                    style="display: none;">

                    <thead>

                        <tr>

                            <th>
                                Course
                            </th>

                            <th>
                                Module
                            </th>

                            <th>
                                Score
                            </th>

                            <th>
                                Percentage
                            </th>

                            <th>
                                Instructor
                            </th>

                            <th>
                                Feedback
                            </th>

                            <th>
                                Graded
                            </th>

                        </tr>

                    </thead>

                    <tbody id="gradesBody">

                    </tbody>

                </table>

            </div>

        </main>

    </div>



    <script src="../api-config.js"></script>
<script>

        /* ================================
           API
        ================================= */

        const API_BASE_URL = window.SIKNAYAN_API_ORIGIN;


        /* ================================
           TOKEN
        ================================= */

        const token =
            sessionStorage.getItem(
                "authToken"
            );


        /* ================================
           USER
        ================================= */

        const savedUser =
            sessionStorage.getItem(
                "user"
            );


        const userName =
            document.getElementById(
                "userName"
            );


        if (savedUser) {

            try {

                const user =
                    JSON.parse(savedUser);

                userName.textContent =
                    user.name || "Learner";

            } catch (error) {

                userName.textContent =
                    "Learner";

            }

        }


        /* ================================
           ELEMENTS
        ================================= */

        const loading =
            document.getElementById(
                "loading"
            );

        const emptyState =
            document.getElementById(
                "emptyState"
            );

        const errorState =
            document.getElementById(
                "errorState"
            );

        const gradesTable =
            document.getElementById(
                "gradesTable"
            );

        const gradesBody =
            document.getElementById(
                "gradesBody"
            );

        const gradedCount =
            document.getElementById(
                "gradedCount"
            );

        const averageScore =
            document.getElementById(
                "averageScore"
            );

        const latestGrade =
            document.getElementById(
                "latestGrade"
            );


        /* ================================
           LOGIN CHECK
        ================================= */

        if (!token) {

            window.location.href =
                "../index.html";

        } else {

            loadGrades();

        }


        /* ================================
           LOAD GRADES
        ================================= */

        async function loadGrades() {

            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/student/grades`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                /* =========================
                   SESSION EXPIRED
                ========================== */

                if (
                    response.status === 401
                ) {

                    sessionStorage.clear();

                    window.location.href =
                        "../index.html";

                    return;

                }


                /* =========================
                   SERVER ERROR
                ========================== */

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load grades."
                    );

                }


                const grades =
                    data.grades || [];


                loading.style.display =
                    "none";


                /* =========================
                   NO GRADES
                ========================== */

                if (grades.length === 0) {

                    emptyState.style.display =
                        "block";

                    return;

                }


                /* =========================
                   SHOW TABLE
                ========================== */

                gradesTable.style.display =
                    "table";


                /* =========================
                   SUMMARY
                ========================== */

                gradedCount.textContent =
                    grades.length;


                const percentages =
                    grades
                        .map(
                            grade =>
                                Number(
                                    grade.percentage
                                )
                        )
                        .filter(
                            value =>
                                !isNaN(value)
                        );


                if (
                    percentages.length > 0
                ) {

                    const average =
                        percentages.reduce(
                            (
                                total,
                                value
                            ) =>
                                total + value,
                            0
                        ) / percentages.length;


                    averageScore.textContent =
                        `${average.toFixed(2)}%`;

                }


                if (grades[0]) {

                    latestGrade.textContent =
                        `${Number(
                            grades[0].percentage
                        ).toFixed(2)}%`;

                }


                /* =========================
                   TABLE ROWS
                ========================== */

                gradesBody.innerHTML =
                    grades.map(
                        grade => {

                            const percentage =
                                Number(
                                    grade.percentage
                                );


                            const gradedDate =
                                grade.graded_at
                                    ? new Date(
                                        grade.graded_at
                                      ).toLocaleDateString()
                                    : "--";


                            return `

                                <tr>

                                    <td>

                                        <strong>
                                            ${escapeHtml(
                                                grade.course?.code ||
                                                ""
                                            )}
                                        </strong>

                                        <br>

                                        ${escapeHtml(
                                            grade.course?.name ||
                                            "Unknown Course"
                                        )}

                                    </td>


                                    <td>

                                        ${escapeHtml(
                                            grade.module?.name ||
                                            "Unknown Module"
                                        )}

                                    </td>


                                    <td>

                                        <span class="score">

                                            ${escapeHtml(
                                                grade.score
                                            )}
                                            /
                                            ${escapeHtml(
                                                grade.max_score
                                            )}

                                        </span>

                                    </td>


                                    <td>

                                        <span class="percentage">

                                            ${
                                                isNaN(
                                                    percentage
                                                )
                                                    ? "--"
                                                    : percentage.toFixed(2) + "%"
                                            }

                                        </span>

                                    </td>


                                    <td>

                                        ${escapeHtml(
                                            grade.instructor ||
                                            "Instructor"
                                        )}

                                    </td>


                                    <td>

                                        <div class="feedback">

                                            ${escapeHtml(
                                                grade.feedback ||
                                                "No feedback provided."
                                            )}

                                        </div>

                                    </td>


                                    <td>

                                        ${gradedDate}

                                    </td>

                                </tr>

                            `;

                        }
                    ).join("");


            } catch (error) {

                loading.style.display =
                    "none";

                errorState.style.display =
                    "block";

                errorState.textContent =
                    error.message ||
                    "Unable to load grades.";

            }

        }


        /* ================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
