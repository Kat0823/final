<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Notifications - MPSU ETEEAP LMS</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            background: #086b3c;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            color: white;

            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;

            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;

            object-fit: contain;
        }

        .brand-title {
            font-size: 23px;

            font-weight: bold;

            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 14px;
        }

        .user-link {
            color: white;
        }

        .user-link:hover {
            text-decoration: underline;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            display: flex;

            min-height: 100vh;

            padding-top: 84px;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            top: 84px;
            left: 0;

            width: 270px;

            height: calc(100vh - 84px);

            background: #086b3c;

            padding: 25px 12px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;
        }

        .view {
            height: 60px;

            padding: 0 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            color: white;

            font-size: 20px;
        }

        .menu {
            width: 100%;

            height: 47px;

            display: flex;

            align-items: center;

            gap: 20px;

            padding: 0 25px;

            margin-bottom: 5px;

            border-radius: 9px;

            color: white;

            font-size: 18px;

            text-decoration: none;
        }

        .menu:hover {
            background: rgba(255,255,255,0.10);
        }

        .menu.active {
            background: #ffd34e;

            color: #222;
        }

        .menu i {
            width: 22px;

            text-align: center;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            margin-left: 270px;

            width: calc(100% - 270px);

            min-height: calc(100vh - 84px);

            padding: 35px 40px;
        }

        .content h1 {
            font-size: 30px;

            margin-bottom: 25px;
        }


        /* =========================
           NOTIFICATION HEADER
        ========================= */

        .notification-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .notification-header p {
            color: #666;

            font-size: 15px;
        }


        /* =========================
           NOTIFICATION LIST
        ========================= */

        .notifications {
            display: flex;

            flex-direction: column;

            gap: 12px;

            max-width: 900px;
        }

        .notification {
            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 18px 20px;

            background: white;

            display: flex;

            gap: 15px;
        }

        .notification-icon {
            width: 42px;

            height: 42px;

            min-width: 42px;

            border-radius: 50%;

            background: #086b3c;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .notification-content {
            flex: 1;
        }

        .notification-title {
            font-size: 17px;

            font-weight: bold;

            margin-bottom: 6px;
        }

        .notification-message {
            color: #555;

            line-height: 1.5;

            margin-bottom: 7px;
        }

        .notification-date {
            color: #888;

            font-size: 13px;
        }


        /* =========================
           UNREAD
        ========================= */

        .notification.unread {
            background: #f3fbf6;

            border-left: 6px solid #086b3c;
        }

        .unread-label {
            display: inline-block;

            margin-left: 8px;

            padding: 3px 7px;

            border-radius: 10px;

            background: #ffd34e;

            color: #222;

            font-size: 11px;

            font-weight: bold;
        }


        /* =========================
           EMPTY / LOADING / ERROR
        ========================= */

        .state {
            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 35px;

            max-width: 900px;

            text-align: center;

            color: #666;
        }

        .state i {
            font-size: 30px;

            color: #086b3c;

            margin-bottom: 12px;
        }

        .error-state {
            color: #9b2525;
        }

        .error-state i {
            color: #9b2525;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .header {
                position: relative;

                height: auto;

                min-height: 75px;

                padding: 10px 15px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .header-right {
                display: none;
            }

            .main {
                padding-top: 0;

                display: block;
            }

            .sidebar {
                position: relative;

                top: auto;
                left: auto;

                width: 100%;

                height: auto;

                flex-direction: row;

                overflow-x: auto;

                padding: 8px;
            }

            .view {
                display: none;
            }

            .menu {
                min-width: 105px;

                justify-content: center;

                font-size: 13px;

                padding: 10px;

                margin: 0 3px;
            }

            .content {
                margin-left: 0;

                width: 100%;

                padding: 20px 15px;
            }

            .content h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div>

                <div class="brand-title">
                    MPSU ETEEAP LMS
                </div>

                <div class="brand-subtitle">
                    Mountain Province State University
                </div>

            </div>

        </div>


        <div class="header-right">

            <a
                href="profile.html"
                class="user-link"
                id="userName">

                Learner

            </a>

        </div>

    </header>



    <!-- MAIN -->

    <div class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div>

                <div class="view">

                    <span>
                        View
                    </span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>


                <a
                    href="classes.html"
                    class="menu">

                    <i class="fa-regular fa-folder"></i>

                    <span>
                        Classes
                    </span>

                </a>


                <a
                    href="grades.html"
                    class="menu">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Grades
                    </span>

                </a>


                <a
                    href="notification.html"
                    class="menu active">

                    <i class="fa-regular fa-bell"></i>

                    <span>
                        Notifications
                    </span>

                </a>


                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>
                        Profile
                    </span>

                </a>

            </div>


            <div>

                <a
                    href="logout.html"
                    class="menu">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </aside>



        <!-- CONTENT -->

        <main class="content">

            <h1>
                Notifications
            </h1>


            <div class="notification-header">

                <p id="notificationCount">
                    Loading notifications...
                </p>

            </div>


            <!-- LOADING -->

            <div
                id="loadingState"
                class="state">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>
                    Loading notifications...
                </p>

            </div>


            <!-- EMPTY -->

            <div
                id="emptyState"
                class="state"
                style="display: none;">

                <i class="fa-regular fa-bell"></i>

                <p>
                    You have no notifications.
                </p>

            </div>


            <!-- ERROR -->

            <div
                id="errorState"
                class="state error-state"
                style="display: none;">

                <i class="fa-solid fa-circle-exclamation"></i>

                <p id="errorMessage">
                    Unable to load notifications.
                </p>

            </div>


            <!-- NOTIFICATIONS -->

            <div
                id="notifications"
                class="notifications"
                style="display: none;">

            </div>

        </main>

    </div>



    <script>

        /* ================================
           API
        ================================= */

        const API_BASE_URL =
            "http://localhost:8000";


        /* ================================
           TOKEN
        ================================= */

        const token =
            sessionStorage.getItem(
                "authToken"
            );


        /* ================================
           USER
        ================================= */

        const savedUser =
            sessionStorage.getItem(
                "user"
            );


        const userName =
            document.getElementById(
                "userName"
            );


        if (savedUser) {

            try {

                const user =
                    JSON.parse(savedUser);

                userName.textContent =
                    user.name || "Learner";

            } catch (error) {

                userName.textContent =
                    "Learner";

            }

        }


        /* ================================
           ELEMENTS
        ================================= */

        const loadingState =
            document.getElementById(
                "loadingState"
            );

        const emptyState =
            document.getElementById(
                "emptyState"
            );

        const errorState =
            document.getElementById(
                "errorState"
            );

        const errorMessage =
            document.getElementById(
                "errorMessage"
            );

        const notificationsContainer =
            document.getElementById(
                "notifications"
            );

        const notificationCount =
            document.getElementById(
                "notificationCount"
            );


        /* ================================
           LOGIN CHECK
        ================================= */

        if (!token) {

            window.location.href =
                "../index.html";

        } else {

            loadNotifications();

        }


        /* ================================
           LOAD NOTIFICATIONS
        ================================= */

        async function loadNotifications() {

            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/student/notifications`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                /* =========================
                   SESSION EXPIRED
                ========================== */

                if (
                    response.status === 401
                ) {

                    sessionStorage.clear();

                    window.location.href =
                        "../index.html";

                    return;

                }


                /* =========================
                   SERVER ERROR
                ========================== */

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load notifications."
                    );

                }


                const notifications =
                    data.notifications || [];


                loadingState.style.display =
                    "none";


                /* =========================
                   EMPTY
                ========================== */

                if (
                    notifications.length === 0
                ) {

                    emptyState.style.display =
                        "block";

                    notificationCount.textContent =
                        "No notifications";

                    return;

                }


                /* =========================
                   COUNT
                ========================== */

                const unreadCount =
                    notifications.filter(
                        notification =>
                            !notification.is_read
                    ).length;


                notificationCount.textContent =
                    unreadCount > 0
                        ? `${unreadCount} unread notification${unreadCount === 1 ? "" : "s"}`
                        : `${notifications.length} notification${notifications.length === 1 ? "" : "s"}`;


                /* =========================
                   SHOW CONTAINER
                ========================== */

                notificationsContainer.style.display =
                    "flex";


                /* =========================
                   DISPLAY NOTIFICATIONS
                ========================== */

                notificationsContainer.innerHTML =
                    notifications.map(
                        notification => {

                            const unread =
                                !notification.is_read;


                            const date =
                                notification.created_at
                                    ? new Date(
                                        notification.created_at
                                      ).toLocaleString()
                                    : "";


                            return `

                                <div class="notification ${
                                    unread
                                        ? "unread"
                                        : ""
                                }">

                                    <div class="notification-icon">

                                        <i class="fa-regular fa-bell"></i>

                                    </div>


                                    <div class="notification-content">

                                        <div class="notification-title">

                                            ${escapeHtml(
                                                notification.title ||
                                                "Notification"
                                            )}

                                            ${
                                                unread
                                                    ? `
                                                        <span class="unread-label">
                                                            NEW
                                                        </span>
                                                      `
                                                    : ""
                                            }

                                        </div>


                                        <div class="notification-message">

                                            ${escapeHtml(
                                                notification.message ||
                                                ""
                                            )}

                                        </div>


                                        <div class="notification-date">

                                            ${escapeHtml(
                                                date
                                            )}

                                        </div>

                                    </div>

                                </div>

                            `;

                        }
                    ).join("");


            } catch (error) {

                loadingState.style.display =
                    "none";

                errorState.style.display =
                    "block";

                errorMessage.textContent =
                    error.message ||
                    "Unable to load notifications.";

            }

        }


        /* ================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
