<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | MPSU ETEEAP LMS</title>
    <link rel="icon" href="../images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/portal.css">
</head>
<!-- Logout now opens a confirmation box from the sidebar on every page.
     This page is kept for old links: it opens the same box, and
     Cancel returns to Classes. -->
<body data-page="logout">
    <main class="main-content" id="main"></main>

    <script src="../api-config.js"></script>
    <script src="js/portal.js"></script>
    <script>
        (function () {
            if (!window.Portal) return;
            const dialog = document.getElementById("logoutDialog");
            let leaving = false;

            dialog.querySelector("[data-logout-confirm]").addEventListener("click", () => { leaving = true; });
            dialog.addEventListener("close", () => {
                if (!leaving) window.location.replace("classes.html");
            });

            window.Portal.openLogout();
        })();
    </script>
</body>
</html>
