<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Logout - MPSU ETEEAP LMS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        /* =========================================
           RESET
        ========================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
        }

        a {
            text-decoration: none;
        }


        /* =========================================
           HEADER
        ========================================== */

        .header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            background: #086b3c;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            color: white;

            border-radius: 0 0 4px 4px;

            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .header-titles {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            color: white;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            color: white;
            font-size: 14px;
        }


        /* =========================================
           HEADER RIGHT
        ========================================== */

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .user-link {
            color: white;
            font-size: 16px;
            text-decoration: underline;
            cursor: pointer;
        }

        .user-link:hover {
            color: #ffd32a;
        }


        /* =========================================
           MAIN
        ========================================== */

        .main {
            display: flex;
            min-height: 100vh;
            padding-top: 84px;
        }


        /* =========================================
           SIDEBAR
        ========================================== */

        .sidebar {
            position: fixed;

            top: 84px;
            left: 0;

            width: 270px;
            height: calc(100vh - 84px);

            background: #086b3c;

            padding: 25px 12px;

            border-radius: 0 0 7px 0;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            overflow-y: auto;

            z-index: 900;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
        }

        .sidebar-bottom {
            margin-top: auto;
        }


        /* =========================================
           VIEW
        ========================================== */

        .view {
            height: 60px;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: white;

            font-size: 20px;

            margin-bottom: 10px;
        }

        .view i {
            font-size: 22px;
            color: white;
        }


        /* =========================================
           MENU
        ========================================== */

        .menu {
            width: 100%;
            height: 47px;

            display: flex;
            align-items: center;

            gap: 20px;

            padding: 0 25px;

            margin-bottom: 5px;

            border-radius: 9px;

            color: white;

            font-size: 18px;

            transition: background 0.2s;

            text-decoration: none;
        }

        .menu,
        .menu:hover,
        .menu:focus,
        .menu:active,
        .menu:visited {
            text-decoration: none;
        }

        .menu i {
            width: 22px;
            text-align: center;
            font-size: 19px;
        }

        .menu:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .menu.active {
            background: #ffd34e;
            color: #222;
            font-weight: normal;
        }

        .menu.active i {
            color: #222;
        }

        .logout-menu {
            margin-bottom: 0;
        }


        /* =========================================
           CONTENT
        ========================================== */

        .content {
            margin-left: 270px;

            width: calc(100% - 270px);

            background-color: #ffffff;

            padding: 35px 40px;

            min-width: 0;

            min-height: calc(100vh - 84px);
        }


        /* =========================================
           TITLE
        ========================================== */

        .title-row {
            margin-bottom: 15px;
        }

        .title-row h1 {
            font-size: 28px;
            color: #222;
        }

        .title-row p {
            margin-top: 6px;
            color: #666;
            font-size: 14px;
        }

        .content hr {
            width: 100%;

            border: none;

            border-top: 1px solid #dddddd;

            margin-bottom: 35px;
        }


        /* =========================================
           LOGOUT CONTAINER
        ========================================== */

        .logout-container {
            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        /* =========================================
           LOGOUT CARD
        ========================================== */

        .logout-box {
            width: 100%;

            max-width: 600px;

            background-color: white;

            border: 1px solid #d7d7d7;

            border-radius: 10px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.06);
        }


        /* =========================================
           LOGOUT ICON
        ========================================== */

        .logout-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background-color: #eaf6ef;

            color: #086b3c;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 28px;
        }


        /* =========================================
           TEXT
        ========================================== */

        .logout-box h2 {
            font-size: 24px;

            color: #222;

            margin-bottom: 10px;
        }

        .logout-box p {
            color: #666;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* =========================================
           BUTTONS
        ========================================== */

        .logout-buttons {
            display: flex;

            justify-content: center;

            gap: 12px;
        }

        .logout-buttons button {
            min-width: 130px;

            padding: 11px 20px;

            border-radius: 6px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }


        /* =========================================
           CANCEL BUTTON
        ========================================== */

        .cancel-btn {
            background-color: white;

            color: #333;

            border: 1px solid #bdbdbd;
        }

        .cancel-btn:hover {
            background-color: #f3f3f3;
        }


        /* =========================================
           LOGOUT BUTTON
        ========================================== */

        .confirm-logout-btn {
            background-color: #086b3c;

            color: white;

            border: 1px solid #086b3c;
        }

        .confirm-logout-btn:hover {
            background-color: #075c34;
        }


        /* =========================================
           TABLET
        ========================================== */

        @media (max-width: 1000px) {

            .sidebar {
                width: 230px;
            }

            .content {
                margin-left: 230px;

                width: calc(100% - 230px);

                padding: 30px;
            }

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media (max-width: 768px) {

            .header {
                position: relative;

                height: auto;

                min-height: 84px;

                padding: 15px 20px;
            }

            .header-logo {
                width: 48px;
                height: 48px;
            }

            .brand-title {
                font-size: 18px;
            }

            .brand-subtitle {
                font-size: 11px;
            }

            .header-right {
                display: none;
            }

            .main {
                flex-direction: column;

                padding-top: 0;
            }


            /* MOBILE SIDEBAR */

            .sidebar {
                position: relative;

                top: auto;
                left: auto;

                width: 100%;
                height: auto;

                min-width: 100%;
                min-height: auto;

                display: flex;
                flex-direction: row;

                overflow-x: auto;

                padding: 8px;

                gap: 5px;

                border-radius: 0;
            }

            .sidebar-top {
                display: flex;
                flex-direction: row;
                gap: 5px;
            }

            .sidebar-bottom {
                margin-top: 0;
            }

            .view {
                display: none;
            }

            .menu {
                min-width: 105px;

                white-space: nowrap;

                justify-content: center;

                padding: 10px;

                margin: 0;

                font-size: 13px;
            }

            .content {
                margin-left: 0;

                width: 100%;

                padding: 25px 15px;

                min-height: auto;
            }

            .title-row h1 {
                font-size: 24px;
            }

            .logout-box {
                padding: 30px 20px;
            }

            .logout-buttons {
                flex-direction: column;
            }

            .logout-buttons button {
                width: 100%;
            }

        }


        /* =========================================
           SMALL MOBILE
        ========================================== */

        @media (max-width: 480px) {

            .header-logo {
                width: 42px;
                height: 42px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .logout-box {
                padding: 25px 18px;
            }

            .logout-box h2 {
                font-size: 21px;
            }

            .logout-icon {
                width: 60px;
                height: 60px;

                font-size: 24px;
            }

            .menu {
                min-width: 90px;
                font-size: 11px;
            }

            .menu i {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div class="header-titles">

                <h1 class="brand-title">
                    MPSU ETEEAP LMS
                </h1>

                <p class="brand-subtitle">
                    Mountain Province State University
                </p>

            </div>

        </div>


        <div class="header-right">

            <a
                href="profile.html"
                class="user-link">

                Macross Arsel

            </a>

        </div>

    </header>



    <!-- MAIN -->

    <div class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-top">

                <div class="view">

                    <span>View</span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>


                <a
                    href="classes.html"
                    class="menu">

                    <i class="fa-regular fa-folder"></i>

                    <span>Classes</span>

                </a>


                <a
                    href="grades.html"
                    class="menu">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>Grades</span>

                </a>


                <a
                    href="notification.html"
                    class="menu">

                    <i class="fa-regular fa-bell"></i>

                    <span>Notifications</span>

                </a>


                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>Profile</span>

                </a>

            </div>


            <div class="sidebar-bottom">

                <a
                    href="logout.html"
                    class="menu logout-menu active">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>Logout</span>

                </a>

            </div>

        </aside>



        <!-- CONTENT -->

        <main class="content">


            <div class="title-row">

                <h1>
                    Logout
                </h1>

            </div>


            <hr>


            <!-- LOGOUT CARD -->

            <div class="logout-container">

                <div class="logout-box">

                    <div class="logout-icon">

                        <i class="fa-solid fa-right-from-bracket"></i>

                    </div>


                    <h2>
                        Are you sure?
                    </h2>


                    <p>
                        Do you really want to logout from
                        your student account?
                    </p>


                    <div class="logout-buttons">

                        <button
                            type="button"
                            class="cancel-btn"
                            onclick="goBack()">

                            Cancel

                        </button>


                        <button
                            type="button"
                            class="confirm-logout-btn"
                            onclick="logoutUser()">

                            Yes, Logout

                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>



    <!-- JAVASCRIPT -->

    <script src="../api-config.js"></script>
<script>

        function goBack() {

            window.location.href = "classes.html";

        }


        function logoutUser() {

            if (window.siknayanLogout) {
                window.siknayanLogout("../index.html");
                return;
            }

            sessionStorage.clear();

            localStorage.removeItem("isLoggedIn");

            window.location.href = "../index.html";

        }

    </script>

</body>

</html>
