<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Submit Activity - MPSU ETEEAP LMS</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        a {
            text-decoration: none;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 84px;

            background: #086b3c;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            color: white;

            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .brand-subtitle {
            font-size: 14px;
        }

        .user-link {
            color: white;
            text-decoration: none;
        }

        .user-link:hover {
            text-decoration: underline;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            display: flex;
            min-height: 100vh;

            padding-top: 84px;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            top: 84px;
            left: 0;

            width: 270px;
            height: calc(100vh - 84px);

            background: #086b3c;

            padding: 25px 12px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .view {
            height: 60px;

            padding: 0 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: white;

            font-size: 20px;
        }

        .menu {
            width: 100%;
            height: 47px;

            display: flex;
            align-items: center;

            gap: 20px;

            padding: 0 25px;

            margin-bottom: 5px;

            border-radius: 9px;

            color: white;

            font-size: 18px;

            text-decoration: none;
        }

        .menu:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        .menu.active {
            background: #ffd34e;
            color: #222;
        }

        .menu i {
            width: 22px;
            text-align: center;
        }

        .sidebar-bottom {
            margin-top: auto;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            margin-left: 270px;

            width: calc(100% - 270px);

            min-height: calc(100vh - 84px);

            padding: 35px 40px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            color: #086b3c;

            margin-bottom: 20px;

            font-size: 15px;
        }

        .back-button:hover {
            text-decoration: underline;
        }


        /* =========================
           PAGE TITLE
        ========================= */

        .content h1 {
            font-size: 30px;

            margin-bottom: 25px;
        }


        /* =========================
           MODULE INFORMATION
        ========================= */

        .module-info {
            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 22px;

            margin-bottom: 25px;

            background: white;
        }

        .module-info h2 {
            font-size: 22px;

            margin-bottom: 8px;

            color: #086b3c;
        }

        .module-info p {
            color: #666;

            line-height: 1.5;
        }


        /* =========================
           FORM
        ========================= */

        .submission-form {
            border: 2px solid #35a36b;

            border-radius: 9px;

            padding: 25px;

            max-width: 800px;

            background: white;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .file-input {
            width: 100%;

            border: 1px solid #bbb;

            border-radius: 6px;

            padding: 12px;

            background: #fafafa;

            cursor: pointer;
        }

        textarea {
            width: 100%;

            min-height: 130px;

            resize: vertical;

            border: 1px solid #bbb;

            border-radius: 6px;

            padding: 12px;

            font-family: Arial, sans-serif;

            font-size: 15px;
        }

        textarea:focus,
        .file-input:focus {
            outline: none;

            border-color: #086b3c;
        }


        /* =========================
           FILE NAME
        ========================= */

        .file-name {
            margin-top: 8px;

            color: #666;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================
           BUTTON
        ========================= */

        .submit-button {
            border: none;

            background: #086b3c;

            color: white;

            padding: 12px 22px;

            border-radius: 6px;

            font-size: 15px;

            cursor: pointer;
        }

        .submit-button:hover {
            background: #064d2c;
        }

        .submit-button:disabled {
            background: #999;

            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            display: none;

            padding: 12px 15px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .message.success {
            display: block;

            background: #dff3e7;

            color: #176b3a;
        }

        .message.error {
            display: block;

            background: #f8dddd;

            color: #9b2525;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 650px) {

            .header {
                position: relative;

                height: auto;

                min-height: 75px;

                padding: 10px 15px;
            }

            .header-logo {
                width: 45px;
                height: 45px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 10px;
            }

            .header-right {
                display: none;
            }

            .main {
                padding-top: 0;

                display: block;
            }

            .sidebar {
                position: relative;

                top: auto;
                left: auto;

                width: 100%;

                height: auto;

                display: flex;

                flex-direction: row;

                overflow-x: auto;

                padding: 8px;
            }

            .view {
                display: none;
            }

            .menu {
                min-width: 105px;

                justify-content: center;

                font-size: 13px;

                padding: 10px;

                margin: 0 3px;
            }

            .sidebar-bottom {
                margin-top: 0;
            }

            .content {
                margin-left: 0;

                width: 100%;

                padding: 20px 15px;
            }

            .content h1 {
                font-size: 25px;
            }

            .submission-form {
                padding: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div class="header-left">

            <img
                src="../images/logo.png"
                class="header-logo"
                alt="MPSU Logo">

            <div>

                <div class="brand-title">
                    MPSU ETEEAP LMS
                </div>

                <div class="brand-subtitle">
                    Mountain Province State University
                </div>

            </div>

        </div>


        <div class="header-right">

            <a
                href="profile.html"
                class="user-link"
                id="userName">

                Learner

            </a>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <div class="main">


        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div>

                <div class="view">

                    <span>
                        View
                    </span>

                    <i class="fa-solid fa-table-columns"></i>

                </div>


                <a
                    href="classes.html"
                    class="menu active">

                    <i class="fa-regular fa-folder"></i>

                    <span>
                        Classes
                    </span>

                </a>


                <a
                    href="grades.html"
                    class="menu">

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Grades
                    </span>

                </a>


                <a
                    href="notification.html"
                    class="menu">

                    <i class="fa-regular fa-bell"></i>

                    <span>
                        Notifications
                    </span>

                </a>


                <a
                    href="profile.html"
                    class="menu">

                    <i class="fa-regular fa-user"></i>

                    <span>
                        Profile
                    </span>

                </a>

            </div>


            <div class="sidebar-bottom">

                <a
                    href="logout.html"
                    class="menu">

                    <i class="fa-solid fa-arrow-right-from-bracket"></i>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </aside>



        <!-- =========================
             CONTENT
        ========================== -->

        <main class="content">


            <a
                href="javascript:history.back()"
                class="back-button">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>


            <h1>
                Submit Activity
            </h1>


            <!-- MODULE INFORMATION -->

            <div
                class="module-info"
                id="moduleInfo">

                Loading module...

            </div>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <!-- SUBMISSION FORM -->

            <form
                id="submissionForm"
                class="submission-form">


                <div class="form-group">

                    <label for="file">

                        Upload File

                    </label>


                    <input
                        type="file"
                        id="file"
                        name="file"
                        class="file-input"
                        accept=".pdf,.doc,.docx"
                        required>


                    <div
                        class="file-name"
                        id="fileName">

                        Accepted formats:
                        PDF, DOC, DOCX
                        (maximum 10 MB)

                    </div>

                </div>



                <div class="form-group">

                    <label for="comment">

                        Comment

                        <span
                            style="font-weight: normal;">

                            (Optional)

                        </span>

                    </label>


                    <textarea
                        id="comment"
                        name="comment"
                        placeholder="Add a comment about your submission..."></textarea>

                </div>



                <button
                    type="submit"
                    class="submit-button"
                    id="submitButton">

                    <i class="fa-solid fa-upload"></i>

                    Submit Activity

                </button>


            </form>

        </main>

    </div>



    <script src="../api-config.js"></script>
    <script>

        /* ================================
           API
        ================================= */

        const API_BASE_URL =
            window.SIKNAYAN_API_ORIGIN;


        /* ================================
           GET MODULE ID
        ================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const moduleId =
            params.get("module");


        /* ================================
           GET AUTH TOKEN
        ================================= */

        const token =
            sessionStorage.getItem(
                "authToken"
            );


        /* ================================
           GET USER INFORMATION
        ================================= */

        const savedUser =
            sessionStorage.getItem(
                "user"
            );

        const userName =
            document.getElementById(
                "userName"
            );


        if (savedUser) {

            try {

                const user =
                    JSON.parse(savedUser);

                userName.textContent =
                    user.name || "Learner";

            } catch (error) {

                userName.textContent =
                    "Learner";

            }

        }


        /* ================================
           GET ELEMENTS
        ================================= */

        const moduleInfo =
            document.getElementById(
                "moduleInfo"
            );

        const form =
            document.getElementById(
                "submissionForm"
            );

        const message =
            document.getElementById(
                "message"
            );

        const submitButton =
            document.getElementById(
                "submitButton"
            );

        const fileInput =
            document.getElementById(
                "file"
            );

        const fileName =
            document.getElementById(
                "fileName"
            );

        const commentInput =
            document.getElementById(
                "comment"
            );


        /* ================================
           LOGIN CHECK
        ================================= */

        if (!token) {

            window.location.href =
                "../index.html";

        }


        /* ================================
           MODULE ID CHECK
        ================================= */

        if (!moduleId) {

            showMessage(
                "Module ID is missing.",
                "error"
            );

            moduleInfo.innerHTML = `
                <strong>
                    Unable to open module.
                </strong>

                <p style="margin-top: 8px;">
                    No module was selected.
                </p>
            `;

            form.style.display = "none";

        } else {

            loadModule();

        }


        /* ================================
           LOAD MODULE
        ================================= */

        async function loadModule() {

            try {

                const response =
                    await fetch(
                        `${API_BASE_URL}/api/student/modules/${moduleId}`,
                        {
                            method: "GET",

                            headers: {
                                "Accept":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                /* =========================
                   SESSION EXPIRED
                ========================== */

                if (
                    response.status === 401
                ) {

                    sessionStorage.clear();

                    window.location.href =
                        "../index.html";

                    return;

                }


                /* =========================
                   OTHER ERROR
                ========================== */

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load module."
                    );

                }


                /* =========================
                   MODULE DATA
                ========================== */

                const module =
                    data.module;


                if (!module) {

                    throw new Error(
                        "Module information was not found."
                    );

                }


                moduleInfo.innerHTML = `

                    <h2>
                        ${escapeHtml(
                            module.name
                        )}
                    </h2>

                    <p>
                        ${escapeHtml(
                            module.description ||
                            "No description available."
                        )}
                    </p>

                    ${
                        module.course
                            ? `
                                <p style="margin-top: 10px;">
                                    <strong>
                                        Course:
                                    </strong>

                                    ${escapeHtml(
                                        module.course.name
                                    )}
                                </p>
                              `
                            : ""
                    }

                `;


            } catch (error) {

                moduleInfo.innerHTML = `

                    <strong>
                        Unable to load module.
                    </strong>

                    <p style="margin-top: 8px;">
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                `;

                form.style.display =
                    "none";

            }

        }


        /* ================================
           FILE SELECTION
        ================================= */

        fileInput.addEventListener(
            "change",
            function () {

                if (
                    fileInput.files &&
                    fileInput.files.length > 0
                ) {

                    const file =
                        fileInput.files[0];


                    /* Check file size */

                    if (
                        file.size >
                        10 * 1024 * 1024
                    ) {

                        fileName.textContent =
                            "File is larger than 10 MB.";

                        fileName.style.color =
                            "#9b2525";

                        fileInput.value =
                            "";

                        return;

                    }


                    fileName.textContent =
                        `Selected file: ${file.name}`;

                    fileName.style.color =
                        "#666";

                } else {

                    fileName.textContent =
                        "Accepted formats: PDF, DOC, DOCX (maximum 10 MB)";

                }

            }
        );


        /* ================================
           SUBMIT FORM
        ================================= */

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* =========================
                   CHECK FILE
                ========================== */

                const file =
                    fileInput.files[0];


                if (!file) {

                    showMessage(
                        "Please select a file.",
                        "error"
                    );

                    return;

                }


                /* =========================
                   CHECK FILE SIZE
                ========================== */

                if (
                    file.size >
                    10 * 1024 * 1024
                ) {

                    showMessage(
                        "The file must not be larger than 10 MB.",
                        "error"
                    );

                    return;

                }


                /* =========================
                   CHECK FILE TYPE
                ========================== */

                const allowedTypes = [
                    "application/pdf",
                    "application/msword",
                    "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                ];


                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    showMessage(
                        "Only PDF, DOC, and DOCX files are allowed.",
                        "error"
                    );

                    return;

                }


                /* =========================
                   DISABLE BUTTON
                ========================== */

                submitButton.disabled =
                    true;

                submitButton.innerHTML = `

                    <i
                        class="fa-solid fa-spinner fa-spin">
                    </i>

                    Uploading...

                `;


                /* =========================
                   CREATE FORM DATA
                ========================== */

                const formData =
                    new FormData();


                formData.append(
                    "module_id",
                    moduleId
                );


                formData.append(
                    "file",
                    file
                );


                formData.append(
                    "comment",
                    commentInput.value.trim()
                );


                try {

                    /* =====================
                       SEND TO LARAVEL
                    ====================== */

                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/student/submissions`,
                            {
                                method: "POST",

                                headers: {
                                    "Accept":
                                        "application/json",

                                    "Authorization":
                                        `Bearer ${token}`
                                },

                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    /* =====================
                       SESSION EXPIRED
                    ====================== */

                    if (
                        response.status === 401
                    ) {

                        sessionStorage.clear();

                        window.location.href =
                            "../index.html";

                        return;

                    }


                    /* =====================
                       SERVER ERROR
                    ====================== */

                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Submission failed."
                        );

                    }


                    /* =====================
                       SUCCESS
                    ====================== */

                    showMessage(
                        "Your activity has been submitted successfully.",
                        "success"
                    );


                    form.reset();


                    fileName.textContent =
                        "Submission completed successfully.";


                    submitButton.innerHTML = `

                        <i
                            class="fa-solid fa-check">
                        </i>

                        Submitted

                    `;


                } catch (error) {

                    showMessage(
                        error.message ||
                        "Something went wrong while submitting your activity.",
                        "error"
                    );


                    submitButton.disabled =
                        false;


                    submitButton.innerHTML = `

                        <i
                            class="fa-solid fa-upload">
                        </i>

                        Submit Activity

                    `;

                }

            }
        );


        /* ================================
           SHOW MESSAGE
        ================================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `message ${type}`;

        }


        /* ================================
           ESCAPE HTML
        ================================= */

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
